<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World of DaneCraft</title>
<style>
:root{color-scheme:dark;--gold:#ffd200;--bronze:#8a6a2a;--bronze2:#c8a050;--panel:rgba(10,8,6,.86);--txt:#f0e6cc;--parch:#eadbb4;--ink:#3a2410;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;padding:40px;text-align:center}
.hidden{display:none!important}
button{font-family:inherit}
.btn{background:linear-gradient(#8a1a0a,#5a0a04);color:var(--gold);border:2px solid #c8a050;border-radius:4px;padding:6px 16px;font-size:14px;font-weight:bold;cursor:pointer;text-shadow:0 1px 2px #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 4px rgba(0,0,0,.6);letter-spacing:.3px}
.btn:hover{background:linear-gradient(#aa2a14,#7a1408);color:#fff}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.big{font-size:18px;padding:10px 34px}
/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;pointer-events:none}
#menu>*{pointer-events:auto}
#logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#logo h1{margin:0;font-size:clamp(30px,4.2vw,52px);white-space:nowrap;letter-spacing:4px;color:#ffcf4a;text-shadow:0 0 18px rgba(255,140,20,.65),0 3px 0 #6a3a0a,0 5px 8px #000;font-variant:small-caps}
#logo div{font-size:15px;color:#e8d0a0;letter-spacing:6px;text-shadow:0 2px 4px #000;margin-top:-4px}
.mpanel{position:absolute;background:var(--panel);border:2px solid var(--bronze2);border-radius:6px;box-shadow:0 0 0 2px #000,0 6px 24px rgba(0,0,0,.8),inset 0 0 30px rgba(0,0,0,.6);padding:12px}
.mpanel h3{margin:0 0 8px;color:var(--gold);font-size:16px;text-align:center;letter-spacing:1px;text-shadow:0 2px 2px #000}
#selPanel{right:24px;top:110px;bottom:110px;width:300px;display:flex;flex-direction:column}
#charList{flex:1;overflow:auto}
.charRow{padding:10px;margin-bottom:6px;border:1px solid #4a3a1a;border-radius:4px;cursor:pointer;background:rgba(40,30,15,.5)}
.charRow:hover{border-color:#a88a4a}
.charRow.sel{border-color:var(--gold);background:rgba(90,60,10,.55);box-shadow:inset 0 0 12px rgba(255,200,0,.25)}
.charRow b{color:var(--gold);font-size:17px}
.charRow small{display:block;color:#ccc;margin-top:2px}
#selButtons{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#enterBtn{position:absolute;bottom:34px;left:50%;transform:translateX(-50%)}
#racePanel{left:20px;top:110px;width:250px;max-height:calc(100% - 130px);overflow:auto}
#classPanel{right:20px;top:110px;width:250px;max-height:calc(100% - 130px);overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:4px 0;border:1px solid #3a2a12;border-radius:4px;cursor:pointer;background:rgba(30,20,10,.5)}
.opt:hover{border-color:#a88a4a}
.opt.sel{border-color:var(--gold);background:rgba(90,60,10,.55)}
.opt .ic{width:34px;height:34px;font-size:18px}
.opt .nm{font-weight:bold;font-size:15px}
.opt .tag{font-size:10px;background:#c81;color:#fff;border-radius:3px;padding:1px 4px;margin-left:4px;font-family:Arial,sans-serif;vertical-align:middle}
.opt small{display:block;font-size:11px;color:#bba}
#descBox{left:50%;transform:translateX(-50%);bottom:96px;width:min(640px,calc(100% - 560px));min-width:300px;font-size:13px;line-height:1.4}
#descBox b{color:var(--gold)}
#descBox .trait{color:#8f8}
#createBar{left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:10px;padding:10px 14px}
#createBar input{background:#120c06;border:1px solid var(--bronze2);color:var(--gold);font-family:inherit;font-size:17px;padding:7px 10px;width:190px;border-radius:3px;outline:none}
.cust{display:flex;align-items:center;gap:4px;font-size:12px;color:#ddc}
.cust button{width:24px;height:24px;padding:0;font-size:13px}
#menuHint{position:absolute;bottom:6px;left:10px;font-size:11px;color:#998;pointer-events:none}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .pe{pointer-events:auto}
.ic{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.6);overflow:hidden;flex:none}
.unit{position:absolute;display:flex;align-items:center;filter:drop-shadow(0 2px 3px #000)}
.portrait{width:64px;height:64px;border-radius:50%;border:3px solid #c8a050;background:radial-gradient(circle at 40% 35%,#5a4a3a,#1a120a);display:flex;align-items:center;justify-content:center;font-size:30px;z-index:2;box-shadow:0 0 0 2px #000,inset 0 0 10px #000;position:relative}
.portrait .lv{position:absolute;bottom:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:#1a1208;border:2px solid #c8a050;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold}
.ubody{margin-left:-14px;width:190px;background:rgba(0,0,0,.75);border:2px solid #8a6a2a;border-left:none;border-radius:0 6px 6px 0;padding:3px 6px 4px 18px}
.uname{font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:17px}
.bar{position:relative;height:13px;background:#111;border:1px solid #000;margin-top:2px;border-radius:2px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;transition:width .15s}
.bar>span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;font-family:Arial,sans-serif}
.hp>i{background:linear-gradient(#3fdc3f,#159015)}
.mana>i{background:linear-gradient(#4a7aff,#1a3ab0)}
.rage>i{background:linear-gradient(#ff3a3a,#a01010)}
.energy>i{background:linear-gradient(#ffe84a,#b8a010)}
#pframe{left:12px;top:12px}
#tframe{left:290px;top:12px}
#tframe .portrait{order:2;margin-left:-14px}
#tframe .ubody{order:1;margin-left:0;border-left:2px solid #8a6a2a;border-right:none;border-radius:6px 0 0 6px;padding:3px 18px 4px 6px}
#tframe.elite .portrait{border-color:#ffd200;box-shadow:0 0 0 2px #000,0 0 12px #ffaa00}
#tframe.elite .portrait::after{content:'';position:absolute;inset:-9px;border:3px solid #ffd200;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);opacity:.85}
#tframe .tclass{font-size:10px;color:#ccb;margin-top:1px}
#combo{display:flex;gap:3px;margin-top:3px;height:8px}
#combo i{width:10px;height:8px;border-radius:50%;background:#330;border:1px solid #000}
#combo i.on{background:radial-gradient(#ffb,#f80)}
#petframe{left:30px;top:94px;transform:scale(.72);transform-origin:left top}
#partyframes{position:absolute;left:14px;top:100px;display:flex;flex-direction:column;gap:5px;pointer-events:auto;z-index:5}
.pmem{display:flex;align-items:center;cursor:pointer;width:200px}
.pmem .pcls{width:30px;height:30px;border-radius:50%;background:radial-gradient(#3a3020,#120d08);border:2px solid #8a6a2a;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffd890;z-index:1;box-shadow:0 0 0 1px #000}
.pmem .pbody{margin-left:-8px;flex:1;background:rgba(0,0,0,.72);border:1px solid #8a6a2a;border-left:none;border-radius:0 5px 5px 0;padding:2px 6px 3px 12px}
.pmem .pnm{font-size:11px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden}
.pmem .plv{color:#ffd200;font-size:10px}
.pmem .bar{height:10px}.pmem .bar>span{font-size:9px;line-height:9px}
.pmem.dead{opacity:.55}.pmem.sel .pbody{border-color:#ffd200;box-shadow:0 0 6px #ffd200}
.plate .php{width:56px;height:4px;background:#200;border:1px solid #000;margin:2px auto 0}.plate .php i{display:block;height:100%;background:#3c3}
#tInvite{display:none;margin-top:4px;padding:2px 8px;font-size:11px;background:linear-gradient(#5a4020,#2a1a08);border:1px solid #c8a050;color:#ffd890;border-radius:4px;cursor:pointer;pointer-events:auto}
#invitePop{display:none;position:absolute;left:50%;top:22%;transform:translateX(-50%);width:340px;padding:12px 14px;background:rgba(10,8,6,.92);border:2px solid #c8a050;border-radius:8px;color:#eee;text-align:center;font-size:14px;z-index:30;pointer-events:auto;box-shadow:0 6px 30px #000}
#invitePop .ibtns{display:flex;gap:10px;justify-content:center;margin-top:10px}
#tauras,#pauras{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
#buffs{position:absolute;right:215px;top:12px;display:flex;gap:4px;flex-direction:row-reverse;flex-wrap:wrap;max-width:300px}
.buff{width:30px;text-align:center;font-size:10px;color:#ff8;font-family:Arial,sans-serif;text-shadow:0 1px 1px #000}
.buff .ic{width:30px;height:30px;font-size:15px;border:1px solid #000}
.buff.debuff .ic{box-shadow:0 0 0 2px #c00}
.aura{width:18px;height:18px;font-size:10px;border:1px solid #000}
.aura.mine{box-shadow:0 0 0 1px #ff0}
#mm{position:absolute;right:14px;top:10px;width:184px;text-align:center}
#mmZone{font-size:13px;color:var(--gold);text-shadow:0 1px 2px #000,0 0 4px #000;margin-bottom:3px;font-weight:bold;white-space:nowrap}
#mmWrap{position:relative;width:170px;height:170px;margin:0 auto;border-radius:50%;border:4px solid #8a6a2a;box-shadow:0 0 0 2px #000,0 4px 10px #000,inset 0 0 14px #000;overflow:hidden;background:#000}
#mmCv{width:100%;height:100%;display:block}
#mmN{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffd;font-weight:bold;text-shadow:0 0 3px #000}
#mmClock{font-size:11px;color:#ccc;margin-top:2px;text-shadow:0 1px 2px #000}
#mmBtns{position:absolute;right:0;top:20px;display:flex;flex-direction:column;gap:3px}
.mmb{width:24px;height:24px;border-radius:50%;background:#2a1e10;border:2px solid #8a6a2a;color:var(--gold);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#tracker{position:absolute;right:16px;top:230px;width:250px;text-shadow:0 1px 2px #000,0 0 3px #000;font-size:12px}
#tracker .tq{margin-bottom:6px}
#tracker .tq b{color:var(--gold);font-size:13px;cursor:pointer}
#tracker .tq div{color:#ddd;padding-left:8px}
#tracker .tq div.done{color:#6f6}
#tracker .tq.complete b::after{content:' (Complete)';color:#6f6;font-weight:normal}
#bottom{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#bar{display:flex;gap:3px;padding:5px 6px;background:linear-gradient(#2a2016,#120c06);border:2px solid #8a6a2a;border-radius:6px 6px 0 0;box-shadow:0 0 0 1px #000,0 -2px 10px rgba(0,0,0,.7);position:relative}
.slot{width:44px;height:44px;border:1px solid #000;background:rgba(0,0,0,.6);border-radius:4px;position:relative;cursor:pointer;box-shadow:inset 0 0 6px #000}
.slot .ic{width:42px;height:42px;font-size:22px}
.slot .kb{position:absolute;top:1px;right:3px;font-size:11px;color:#ddd;font-family:Arial,sans-serif;font-weight:bold;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.slot .ct{position:absolute;bottom:1px;right:3px;font-size:12px;color:#fff;font-family:Arial,sans-serif;font-weight:bold;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.slot .cd{position:absolute;inset:0;border-radius:4px;z-index:2;pointer-events:none}
.slot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;color:#ffd;font-family:Arial,sans-serif;text-shadow:0 0 3px #000,0 0 3px #000;z-index:3;pointer-events:none}
.slot.nores .ic{filter:saturate(.3) brightness(.6) sepia(1) hue-rotate(190deg)}
.slot.oor .ic{filter:brightness(.7) sepia(1) hue-rotate(-50deg) saturate(3)}
.slot.locked .ic{filter:grayscale(1) brightness(.4)}
.slot.press{transform:scale(.92)}
.slot.casting{box-shadow:0 0 0 2px #ffd200}
.slot.drop{box-shadow:0 0 0 2px #0f0}
#xpbar{width:100%;height:12px;background:#120a1a;border:1px solid #000;border-top:none;position:relative}
#xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b05aff,#5a1aaa)}
#xpbar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;font-family:Arial,sans-serif;color:#fff;text-shadow:0 0 2px #000}
#micro{position:absolute;right:8px;bottom:8px;display:flex;gap:3px;padding:4px;background:linear-gradient(#2a2016,#120c06);border:2px solid #8a6a2a;border-radius:6px}
.mbtn{width:30px;height:38px;border-radius:4px;border:1px solid #000;background:linear-gradient(#5a3a1a,#2a1a0a);color:var(--gold);font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.mbtn small{font-size:9px;color:#ccb;margin-top:2px;font-family:Arial,sans-serif}
.mbtn:hover{filter:brightness(1.3)}
#castbar{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:260px;height:20px;background:#111;border:2px solid #c8a050;border-radius:3px;display:none;box-shadow:0 0 0 1px #000,0 2px 6px #000}
#castbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffd84a,#c88a10)}
#castbar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:17px;color:#fff;text-shadow:0 0 3px #000}
#chat{position:absolute;left:10px;bottom:12px;width:430px;font-size:13px}
#chatLog{max-height:190px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 1px #000,0 0 3px #000;padding:4px 6px;border-radius:4px;transition:background .3s}
#chat:hover #chatLog{background:rgba(0,0,0,.35)}
#chatLog div{margin:1px 0;line-height:1.25}
#chatIn{width:100%;display:none;background:rgba(0,0,0,.75);border:1px solid #8a6a2a;color:#fff;font-family:inherit;font-size:13px;padding:5px;outline:none}
#err{position:absolute;top:120px;left:50%;transform:translateX(-50%);color:#ff2020;font-size:17px;font-weight:bold;text-shadow:0 1px 2px #000,0 0 4px #000;text-align:center;pointer-events:none}
#err div{transition:opacity .5s}
#warn{position:absolute;top:150px;left:50%;transform:translateX(-50%);color:#ff8a20;font-size:22px;font-weight:bold;text-shadow:0 2px 3px #000,0 0 6px #000;text-align:center;pointer-events:none;white-space:nowrap}
#zt{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity 1s}
#zt h2{margin:0;font-size:46px;color:#ffd84a;text-shadow:0 0 12px rgba(0,0,0,.9),0 3px 2px #000;font-variant:small-caps;letter-spacing:2px}
#zt div{color:#eee;font-size:17px;text-shadow:0 2px 3px #000}
#banner{position:absolute;top:32%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#banner div{color:#fff;font-size:16px;text-shadow:0 2px 3px #000}
#banner h2{margin:0;font-size:44px;color:#ffd200;text-shadow:0 0 18px #f80,0 3px 3px #000}
#plates,#floats{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.plate{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-size:12px;text-shadow:0 1px 1px #000,0 0 3px #000,0 0 2px #000;font-weight:bold;will-change:transform}
.plate small{display:block;font-weight:normal;font-size:11px;color:#cfc}
.plate .mk{font-size:30px;line-height:28px;font-weight:bold;-webkit-text-stroke:1px #000;font-family:Arial,sans-serif}
.plate .phb{width:76px;height:6px;margin:2px auto 0;background:#200;border:1px solid #000}
.plate .phb i{display:block;height:100%;background:#d22}
.flt{position:absolute;font-weight:bold;font-family:Arial,sans-serif;text-shadow:0 0 3px #000,0 2px 2px #000;white-space:nowrap;transform:translate(-50%,-50%);will-change:transform,opacity}
/* windows */
.win{position:absolute;background:var(--panel);border:2px solid var(--bronze2);border-radius:6px;box-shadow:0 0 0 2px #000,0 8px 30px rgba(0,0,0,.85),inset 0 0 30px rgba(0,0,0,.6);pointer-events:auto;display:none;max-height:calc(100% - 190px);overflow:auto}
.win.open{display:block}
.wt{background:linear-gradient(#5a1a0a,#2a0a04);color:var(--gold);padding:6px 34px 6px 12px;font-weight:bold;font-size:15px;border-bottom:2px solid #8a6a2a;cursor:move;position:sticky;top:0;z-index:5;text-shadow:0 1px 2px #000}
.wx{position:absolute;right:6px;top:4px;width:22px;height:22px;border-radius:50%;background:#7a0a0a;border:1px solid #c8a050;color:#fff;font-size:12px;cursor:pointer;line-height:18px;padding:0}
.wb{padding:10px}
.parch{background:linear-gradient(#f0e2bc,#dcc89a);color:var(--ink);border:1px solid #8a6a3a;border-radius:3px;padding:12px;box-shadow:inset 0 0 20px rgba(120,80,30,.35);font-size:14px;line-height:1.45}
.parch h4{margin:0 0 6px;font-size:17px;color:#3a1a00}
.parch .obj{margin:2px 0 2px 10px}
.parch .rw{margin-top:10px;border-top:1px solid #a88a5a;padding-top:6px}
.optl{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border-radius:3px;color:#3a1a00}
.optl:hover{background:rgba(120,80,20,.2)}
.optl .qm{font-family:Arial,sans-serif;font-weight:bold;font-size:18px;width:16px;text-align:center;-webkit-text-stroke:.5px #000}
.grid{display:grid;grid-template-columns:repeat(6,44px);gap:4px}
.cell{width:44px;height:44px;background:rgba(0,0,0,.6);border:1px solid #3a2a12;border-radius:4px;position:relative;cursor:pointer}
.cell .ic{width:42px;height:42px;font-size:20px}
.cell .ct{position:absolute;bottom:1px;right:3px;font-size:12px;font-family:Arial,sans-serif;font-weight:bold;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.qb{box-shadow:inset 0 0 0 2px var(--qc,#888)!important}
.gold{margin-top:8px;text-align:right;font-family:Arial,sans-serif;font-size:13px}
.mg{color:#ffd700}.mg::after{content:'●';color:#ffd700;margin-left:1px;font-size:10px}
.ms{color:#e0e0e0}.ms::after{content:'●';color:#c0c0c0;margin-left:1px;font-size:10px}
.mc{color:#e0a060}.mc::after{content:'●';color:#c87a3a;margin-left:1px;font-size:10px}
.eqrow{display:flex;align-items:center;gap:8px;margin-bottom:4px;cursor:pointer;padding:2px;border-radius:3px}
.eqrow:hover{background:rgba(255,255,255,.06)}
.eqrow .ic{width:36px;height:36px;font-size:18px}
.eqrow small{color:#998;display:block;font-size:11px}
.stats{font-size:13px;line-height:1.6;font-family:Arial,sans-serif}
.stats b{color:var(--gold);float:right}
.sprow{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid #2a1e10;cursor:grab}
.sprow .ic{width:40px;height:40px;font-size:20px}
.sprow.locked{opacity:.45;cursor:default}
.sprow b{color:var(--gold)}
.sprow small{color:#ccb;display:block;font-size:12px;font-family:Arial,sans-serif}
.qlist div{padding:4px 6px;cursor:pointer;border-radius:3px;font-size:13px}
.qlist div:hover{background:rgba(255,255,255,.06)}
.qlist div.sel{background:rgba(255,200,0,.18)}
.vrow{display:flex;align-items:center;gap:8px;padding:4px;cursor:pointer;border-radius:3px;font-size:13px}
.vrow:hover{background:rgba(255,255,255,.08)}
.vrow .ic{width:36px;height:36px;font-size:18px}
#tooltip{position:fixed;z-index:50;pointer-events:none;background:rgba(8,8,24,.94);border:1px solid #9a9ab8;border-radius:4px;padding:7px 9px;font-family:Arial,sans-serif;font-size:13px;line-height:1.35;max-width:300px;display:none;box-shadow:0 2px 10px #000;color:#fff}
#tooltip .tn{font-size:15px;font-weight:bold}
#tooltip .y{color:#ffd200}#tooltip .g{color:#1eff00}#tooltip .r{color:#ff3030}#tooltip .gr{color:#aaa}
#tooltip .row{display:flex;justify-content:space-between;gap:14px}

<script>
// ================= ENGINE: math, mesh building, WebGL renderer =================
'use strict';
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const angWrap = a => { while (a > PI) a -= TAU; while (a < -PI) a += TAU; return a; };
function hexRGB(h) { if (Array.isArray(h)) return h; if (!h) return [.5, .5, .5]; h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function mixc(a, b, t) { a = hexRGB(a); b = hexRGB(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function scalec(a, s) { a = hexRGB(a); return [a[0] * s, a[1] * s, a[2] * s]; }

// seeded RNG + value noise
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = mulberry(seed), P = new Uint8Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const v = (x, z) => G[P[(x & 255) + P[z & 255]]];
  const n = (x, z) => { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), w = zf * zf * (3 - 2 * zf); return lerp(lerp(v(xi, zi), v(xi + 1, zi), u), lerp(v(xi, zi + 1), v(xi + 1, zi + 1), u), w); };
  n.fbm = (x, z, oct = 4) => { let s = 0, a = 1, f = 1, t = 0; for (let i = 0; i < oct; i++) { s += n(x * f, z * f) * a; t += a; a *= .5; f *= 2.03; } return s / t; };
  return n;
}

// ---- 4x4 matrices (column-major) ----
const M4 = {
  I() { const o = new Float32Array(16); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },
  T(x, y, z) { const o = M4.I(); o[12] = x; o[13] = y; o[14] = z; return o; },
  S(x, y = x, z = x) { const o = M4.I(); o[0] = x; o[5] = y; o[10] = z; return o; },
  RY(a) { const o = M4.I(), c = Math.cos(a), s = Math.sin(a); o[0] = c; o[2] = -s; o[8] = s; o[10] = c; return o; },
  RX(a) { const o = M4.I(), c = Math.cos(a), s = Math.sin(a); o[5] = c; o[6] = s; o[9] = -s; o[10] = c; return o; },
  RZ(a) { const o = M4.I(), c = Math.cos(a), s = Math.sin(a); o[0] = c; o[1] = s; o[4] = -s; o[5] = c; return o; },
  chain(...ms) { let r = ms[0]; for (let i = 1; i < ms.length; i++) r = M4.mul(r, ms[i]); return r; },
  persp(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), o = new Float32Array(16); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; },
  lookAt(e, c, u = [0, 1, 0]) {
    let z = [e[0] - c[0], e[1] - c[1], e[2] - c[2]]; let l = Math.hypot(...z); z = z.map(v => v / l);
    let x = [u[1] * z[2] - u[2] * z[1], u[2] * z[0] - u[0] * z[2], u[0] * z[1] - u[1] * z[0]]; l = Math.hypot(...x); x = x.map(v => v / l);
    const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
    const o = new Float32Array(16);
    o[0] = x[0]; o[4] = x[1]; o[8] = x[2]; o[1] = y[0]; o[5] = y[1]; o[9] = y[2]; o[2] = z[0]; o[6] = z[1]; o[10] = z[2];
    o[12] = -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]); o[13] = -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]); o[14] = -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]); o[15] = 1;
    return o;
  },
  xf(m, p) { return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]]; },
  xf4(m, p) { return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14], m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15]]; },

// convenience transform: translate, rotateY, rotateX, rotateZ, scale
function TF(x = 0, y = 0, z = 0, sx = 1, sy = sx, sz = sx, ry = 0, rx = 0, rz = 0) {
  let m = M4.T(x, y, z); if (ry) m = M4.mul(m, M4.RY(ry)); if (rx) m = M4.mul(m, M4.RX(rx)); if (rz) m = M4.mul(m, M4.RZ(rz));
  return M4.mul(m, M4.S(sx, sy, sz));
}

// ---- Mesh builder: pos3 nor3 col3 uv2 layer1 w4  (16 floats) ----
// layer -1 = untextured, -2 = terrain splat (uses w weights against uTL layers), >=0 texture layer (tinted by col)
class MB {
  constructor() { this.d = []; this.L = -1; this.S = .4; this.J = .05; this.E = 0; this.SP = 0; }
  mat(name, s) { this.L = name == null ? -1 : (TEXI[name] !== undefined ? TEXI[name] : -1); if (s !== undefined) this.S = s; return this; }
  glow(e) { this.E = e; return this; }
  spec(v) { this.SP = v; return this; }
  M(name, s, sp = 0) { this.mat(name, s); this.SP = sp; return this; }
  sphereUV(m, seg, rings, col) { col = hexRGB(col); const c = M4.xf(m, [0, 0, 0]); const P = [], N = [], U = []; for (let r = 0; r <= rings; r++) { const ph = r / rings * PI; for (let s = 0; s <= seg; s++) { const th = s / seg * TAU; const lp = [Math.sin(ph) * Math.cos(th) * .5, Math.cos(ph) * .5, Math.sin(ph) * Math.sin(th) * .5]; const wp = M4.xf(m, lp); P.push(wp); const dn = [wp[0] - c[0], wp[1] - c[1], wp[2] - c[2]]; const l = Math.hypot(...dn) || 1; N.push(dn.map(v => v / l)); U.push([s / seg, r / rings]); } } const W = seg + 1; const V = i => this.vert(P[i], N[i], col, U[i][0], U[i][1], this.L); for (let r = 0; r < rings; r++) for (let s = 0; s < seg; s++) { const a = r * W + s, b = a + 1, cc = a + W + 1, d = a + W; V(a); V(b); V(cc); V(a); V(cc); V(d); } return this; }
  vert(p, n, c, u, v, L, w) { this.d.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], u, v, L, w ? w[0] : this.E, w ? w[1] : this.SP, w ? w[2] : 0, w ? w[3] : 0); }
  tri(a, b, c, col, center, na, nb, nc) {
    let ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    if (center) { const cx = (a[0] + b[0] + c[0]) / 3 - center[0], cy = (a[1] + b[1] + c[1]) / 3 - center[1], cz = (a[2] + b[2] + c[2]) / 3 - center[2]; if (cx * nx + cy * ny + cz * nz < 0) { nx = -nx; ny = -ny; nz = -nz; } }
    const fn = [nx, ny, nz];
    if (na && (na[0] * nx + na[1] * ny + na[2] * nz) < -.2) { na = na.map(v => -v); nb = nb.map(v => -v); nc = nc.map(v => -v); }
    const L = this.L, S = this.S, ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
    const uvf = ay >= ax && ay >= az ? p => [p[0] * S, p[2] * S] : ax >= az ? p => [p[2] * S, -p[1] * S] : p => [p[0] * S, -p[1] * S];
    const P = [a, b, c], N = na ? [na, nb, nc] : [fn, fn, fn];
    for (let i = 0; i < 3; i++) { const uv = L >= 0 ? uvf(P[i]) : [0, 0]; this.vert(P[i], N[i], col, uv[0], uv[1], L); }
  }
  quad(a, b, c, d, col, center) { this.tri(a, b, c, col, center); this.tri(a, c, d, col, center); }
  // explicit-uv quad (for foliage cards / decals)
  quadUV(a, b, c, d, col, uvs, n) { const L = this.L; const nn = n || [0, 1, 0]; const P = [a, b, c, a, c, d], U = [uvs[0], uvs[1], uvs[2], uvs[0], uvs[2], uvs[3]]; for (let i = 0; i < 6; i++) this.vert(P[i], nn, col, U[i][0], U[i][1], L); }
  static jit(col, j) { const f = 1 + (Math.random() - .5) * j; return [col[0] * f, col[1] * f, col[2] * f]; }
  box(m, col, j = this.J) {
    col = hexRGB(col); const v = []; for (let i = 0; i < 8; i++) v.push(M4.xf(m, [(i & 1) - .5, (i >> 1 & 1) - .5, (i >> 2 & 1) - .5]));
    const c = M4.xf(m, [0, 0, 0]);
    const F = [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]];
    for (const f of F) this.quad(v[f[0]], v[f[1]], v[f[2]], v[f[3]], MB.jit(col, j), c);
    return this;
  }
  // cylinder along +y 0..1, radius .5*rb bottom, .5*rt top. smooth radial normals by default
  cyl(m, seg, rb, rt, col, j = this.J, colTop, smooth = true) {
    col = hexRGB(col); const ct = colTop ? hexRGB(colTop) : col; const c = M4.xf(m, [0, .5, 0]);
    const B = [], T = [], NB = [], NT = [];
    const slope = (rb - rt) * .5;
    for (let i = 0; i <= seg; i++) { const a = i / seg * TAU, cs = Math.cos(a), sn = Math.sin(a); B.push(M4.xf(m, [cs * rb * .5, 0, sn * rb * .5])); T.push(M4.xf(m, [cs * rt * .5, 1, sn * rt * .5]));
      const lp = M4.xf(m, [cs, slope, sn]), o = M4.xf(m, [0, 0, 0]); let nn = [lp[0] - o[0], lp[1] - o[1], lp[2] - o[2]]; const l = Math.hypot(...nn) || 1; nn = nn.map(v => v / l); NB.push(nn); }
    const bc = M4.xf(m, [0, 0, 0]), tc = M4.xf(m, [0, 1, 0]);
    const cc = MB.jit(col, j);
    for (let i = 0; i < seg; i++) {
      const k = i + 1;
      if (smooth) { if (rt > 0.001) { this.tri(B[i], B[k], T[k], cc, c, NB[i], NB[k], NB[k]); this.tri(B[i], T[k], T[i], cc, c, NB[i], NB[k], NB[i]); } else { const mid = NB[i].map((v, q) => (v + NB[k][q]) / 2); this.tri(B[i], B[k], tc, cc, c, NB[i], NB[k], mid); } }
      else { const c2 = MB.jit(col, j); if (rt > 0.001) this.quad(B[i], B[k], T[k], T[i], c2, c); else this.tri(B[i], B[k], tc, c2, c); }
      if (rb > 0.001) this.tri(B[i], bc, B[k], cc, c);
      if (rt > 0.001) this.tri(T[i], T[k], tc, ct, c);
    }
    return this;
  }
  cone(m, seg, col, j) { return this.cyl(m, seg, 1, 0, col, j); }
  // sphere radius .5; smooth unless deform (rocks)
  sphere(m, seg, rings, col, j = this.J, deform = 0, flat) {
    col = hexRGB(col); const c = M4.xf(m, [0, 0, 0]); const P = [], N = [];
    const smooth = !flat && deform < .3;

// ---------- animation ----------
function animModel(model, st, t) {
  const out = [];
  const sw = Math.sin(st.walk) * st.mv, at = st.atk > 0 ? Math.sin(st.atk * PI) : 0;
  const bob = model.float ? Math.sin(t * 2 + (st.seed || 0)) * .15 * model.float : Math.abs(Math.sin(st.walk)) * .05 * st.mv;
  const breathe = Math.sin(t * 1.6 + (st.seed || 0)) * .012;
  for (const p of model.parts) {
    let m = M4.T(p.p[0], p.p[1] + bob, p.p[2]);
    switch (p.a) {
      case 'legL': m = M4.mul(m, M4.RX(sw * .7)); break;
      case 'legR': m = M4.mul(m, M4.RX(-sw * .7)); break;
      case 'torso': m = M4.chain(m, M4.RX(Math.abs(sw) * .05 + (st.atk > 0 ? at * .18 : 0)), M4.RY(st.atk > 0 ? -at * .25 : 0), M4.S(1 + breathe, 1, 1 + breathe)); break;
      case 'head': m = M4.mul(M4.T(0, breathe * 3, 0), M4.mul(m, M4.RY(Math.sin(t * .5 + (st.seed || 0)) * .1))); break;
      case 'armL': m = st.cast ? M4.mul(m, M4.RX(-1.2 + Math.sin(t * 8) * .1)) : M4.mul(m, M4.mul(M4.RX(-sw * .55), M4.RZ(-.1 - breathe * 2))); break;
      case 'armR': m = st.cast ? M4.mul(m, M4.RX(-1.3 + Math.sin(t * 8 + 1) * .1)) : st.atk > 0 ? M4.mul(m, M4.mul(M4.RX(-.6 - at * 1.7), M4.RZ(at * .45))) : M4.mul(m, M4.mul(M4.RX(sw * .55 - .12), M4.RZ(.1 + breathe * 2))); break;
      case 'body': m = M4.mul(m, M4.RX(st.atk > 0 ? -at * .15 : 0)); if (model.kind === 'bird') m = M4.mul(M4.T(0, Math.sin(t * 3) * .1, 0), m); break;
      case 'qhead': m = M4.mul(m, M4.RX(st.atk > 0 ? at * .5 : Math.sin(t * 1.3 + (st.seed || 0)) * .06)); break;
      case 'qleg': { const ph = (p.i === 0 || p.i === 3) ? 1 : -1; m = M4.mul(m, M4.RX(sw * .6 * ph)); break; }
      case 'sleg': { const ph = p.i % 2 ? 1 : -1; m = M4.chain(m, M4.RY(p.ry + sw * .3 * ph), M4.RZ(Math.abs(Math.sin(st.walk + p.i)) * .15 * st.mv)); break; }
      case 'wing': m = M4.mul(m, M4.RZ(p.i * (Math.sin(t * 6) * .5 + (st.atk > 0 ? at * .4 : 0)))); break;
      case 'core': m = M4.mul(m, M4.RY(t * .7)); break;
      case 'orbit': { const a = t * 1.2 + p.i / 6 * TAU; m = M4.T(Math.cos(a) * p.rad, p.p[1] + Math.sin(a * 2) * .3 + bob, Math.sin(a) * p.rad); m = M4.mul(m, M4.RY(a)); break; }
    }
    out.push(m);
  }
  return out;
}

  // two-story timber house with overhanging upper floor, dormer and glowing windows
  house2(mb, x, y, z, s, rot, pal, variant = 0) {
    const wall = pal.wall || '#f0e6d0', roof = pal.roof || '#3a5a9a', beam = pal.beam || '#4a3420', stone = pal.stone || '#a8a296';
    const M = (a, b, c, sx, sy, sz, rx = 0, rz = 0) => M4.chain(M4.T(x, y, z), M4.RY(rot), TF(a * s, b * s, c * s, sx * s, sy * s, sz * s, 0, rx, rz));
    const W = 8 + variant * 1.5, D = 6.4;
    mb.mat('stoneblock', .28).box(M(0, .9, 0, W + .4, 2.6, D + .4), stone, .02);
    mb.mat('plaster', .25).box(M(0, 3.2, 0, W, 2.2, D), wall, .02);
    mb.box(M(0, 5.6, 0, W + 1.2, 2.6, D + 1.2), wall, .02);
    mb.mat('wood', .35);
    for (const c of [-(D / 2 + .05), D / 2 + .05]) { mb.box(M(0, 2.25, c, W + .2, .35, .3), beam); mb.box(M(0, 4.3, c * 1.2, W + 1.6, .45, .45), beam); mb.box(M(0, 6.95, c * 1.19, W + 1.5, .35, .35), beam); for (let k = -2; k <= 2; k++) { mb.box(M(k * W / 4, 3.2, c, .3, 2.2, .3), beam); mb.box(M(k * (W + 1.2) / 4, 5.6, c * 1.19, .3, 2.6, .3), beam); } mb.box(M(-W * .25 - .5, 5.6, c * 1.19, .22, 2.9, .3, 0, .7), beam); mb.box(M(W * .25 + .5, 5.6, c * 1.19, .22, 2.9, .3, 0, -.7), beam); }
    for (const a of [-(W / 2 + .05), W / 2 + .05]) { mb.box(M(a, 2.25, 0, .3, .35, D + .2), beam); mb.box(M(a * 1.07, 4.3, 0, .45, .45, D + 1.6), beam); for (let k = -1; k <= 1; k++) mb.box(M(a * 1.08, 5.6, k * (D + 1.2) / 3, .3, 2.6, .3), beam); }
    for (let k = -2; k <= 2; k++) mb.box(M(k * W / 4, 4.05, D / 2 + .7, .35, .35, 1.4), beam);
    mb.mat('shingles', .4).prism(M4.chain(M4.T(x, y, z), M4.RY(rot), TF(0, 6.9 * s, 0, (W + 2.4) * s, 4.6 * s, (D + 2.6) * s)), roof, .03, 'plaster');
    // dormer
    mb.mat('plaster', .3).box(M(-W * .2, 8.3, D * .28 + .4, 2.2, 1.6, 2.2), wall); mb.mat('shingles', .5).prism(M4.chain(M4.T(x, y, z), M4.RY(rot), TF(-W * .2 * s, 9.05 * s, (D * .28 + .4) * s, 2.8 * s, 1.4 * s, 2.6 * s, PI / 2)), roof, .03, 'plaster');
    const P = (a, b, c, w, h, ry = 0) => M4.chain(M4.T(x, y, z), M4.RY(rot), M4.T(a * s, b * s, c * s), M4.RY(ry), M4.S(w * s, h * s, 1));
    mb.mat('window').glow(1);
    plate(mb, P(-W * .2, 8.3, D * .28 + 1.52, 1, 1));
    for (const a of [-W * .3, W * .3]) { plate(mb, P(a, 3.3, D / 2 + .08, 1.3, 1.3)); plate(mb, P(a * 1.05, 5.7, D / 2 + .68, 1.5, 1.5)); }
    plate(mb, P(0, 5.7, -(D / 2 + .68), 1.5, 1.5, PI)); plate(mb, P(W / 2 + .68, 5.7, 0, 1.4, 1.4, PI / 2)); plate(mb, P(-(W / 2 + .08), 3.3, 0, 1.2, 1.2, -PI / 2)); plate(mb, P(-(W / 2 + .68), 5.7, 0, 1.4, 1.4, -PI / 2));
    mb.glow(0);
    // door + steps
    mb.mat('wood', .5).box(M(0, 3, D / 2 + .1, 1.6, 2.4, .2), '#5a3418'); mb.mat('metal', 2).box(M(.55, 2.9, D / 2 + .22, .12, .12, .08), '#d8a838');
    mb.mat('stoneblock', .4).box(M(0, 1.55, D / 2 + .7, 2.4, .5, 1.2), stone); mb.box(M(0, 1.05, D / 2 + 1.2, 2.8, .5, 1.4), stone);
    // chimney
    mb.mat('stoneblock', .4).box(M(W * .3, 9.5, -1.6, 1.2, 4.2, 1.2), stone); mb.box(M(W * .3, 11.7, -1.6, 1.5, .3, 1.5), scalec(stone, .8));
  },

function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function segDist(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az; const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1), 0, 1); return Math.hypot(px - ax - dx * t, pz - az - dz * t); }
function roadDist(def, x, z) { let d = 1e9; for (const r of def.roads || []) for (let i = 0; i < r.length - 1; i++) d = Math.min(d, segDist(x, z, r[i][0], r[i][1], r[i + 1][0], r[i + 1][1])); return d; }

function skyMesh(skyCol, fogCol, cloudy = true) {
  const mb = new MB(); mb.mat(cloudy ? 'clouds' : null); const top = hexRGB(skyCol), hor = fogCol; const seg = 20, rings = 10;
  const P = (rr, ss) => { const ph = rr / rings * PI * .62, th = ss / seg * TAU; return [Math.sin(ph) * Math.cos(th) * 500, Math.cos(ph) * 500 - 60, Math.sin(ph) * Math.sin(th) * 500]; };
  const C = rr => { const k = Math.pow(rr / rings, 1.5); return [k, k, k]; };
  const UV = p => [p[0] / 260, p[2] / 260];
  for (let r = 0; r < rings; r++) for (let s = 0; s < seg; s++) {
    const q = [[r, s], [r, s + 1], [r + 1, s + 1], [r, s], [r + 1, s + 1], [r + 1, s]];
    for (const [rr, ss] of q) { const p = P(rr, ss), uv = UV(p); const k = clamp(1 - rr / (rings * .82), 0, 1); mb.vert(p, [0, -1, 0], C(rr), uv[0], uv[1], mb.L, [k * k, 0, 0, 0]); }
  }
  return R.upload(mb);
}
function buildZone(id) {

  const town = def.town; const camps = def.camps || [];
  const wy = def.water ? def.water.y : def.lava ? def.lava.y : -99;
  const townH = (noise.fbm(town.x * .012, town.z * .012) - .5) * 2 * def.amp * .4 + 1;
  function rawH(x, z) {
    let h = (noise.fbm(x * .011 + 10, z * .011 + 10) - .5) * 2 * def.amp + (noise.fbm(x * .05, z * .05, 2) - .5) * 2.4;
    h += (noise.fbm(x * .17 + 3, z * .17 + 9, 2) - .5) * (def.bumpy || .7);
    // border mountains with gate passes
    const d = Math.max(Math.abs(x), Math.abs(z));
    let edge = smooth(92, 117, d);
    for (const g of def.gates) { const ix = g.x * .7, iz = g.z * .7; const gd = segDist(x, z, g.x * 1.1, g.z * 1.1, ix, iz); edge *= smooth(7, 16, gd); }
    h += edge * (26 + noise(x * .07, z * .07) * 22);
    for (const m of def.mesas || []) { const md = Math.hypot(x - m[0], z - m[1]); h += m[3] * smooth(m[2], m[2] * .72, md) * (.85 + .3 * noise(x * .09, z * .09)); }
    for (const l of def.lakes || []) { const ld = Math.hypot(x - l[0], z - l[1]); h = lerp(wy - 2.5 - (1 - ld / l[2]) * 2, h, smooth(l[2] * .55, l[2] * 1.25, ld)); }
    const td = Math.hypot(x - town.x, z - town.z); h = lerp(townH, h, smooth(town.r, town.r * 1.6, td));
    if (def.temple) { const T = def.temple, d2 = Math.max(Math.abs(x - T.x), Math.abs(z - T.z + 4)); const th = (noise.fbm(T.x * .011 + 10, T.z * .011 + 10) - .5) * 2 * def.amp; h = lerp(Math.max(th, wy + 2), h, smooth(T.w * .9, T.w * 1.5, d2)); }
    for (const c of camps) { const cd = Math.hypot(x - c.x, z - c.z); const ch = (noise.fbm(c.x * .011 + 10, c.z * .011 + 10) - .5) * 2 * def.amp; h = lerp(Math.max(ch, wy + 1.5), h, smooth(12, 20, cd)); }
    const rd = roadDist(def, x, z); if (rd < 6) { h = lerp(h, Math.max(h * .7, wy + .8), (1 - rd / 6) * .5); }

    const u = clamp(fx - i, 0, 1), v = clamp(fz - j, 0, 1);

  const colAt = (x, z, h, slope) => { let c = mixc(ground[0], ground[1], noise(x * .08 + 50, z * .08 + 50)); if (roadDist(def, x, z) < 3.5) c = dirt; if (slope > .55) c = high; if (h > 14) c = peak; return c; };
  const hg = (i, j) => HG[clamp(j, 0, N - 1) * N + clamp(i, 0, N - 1)];
  const VN = [], VW = [], VC = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = -SZ + i * step, z = -SZ + j * step, h = hg(i, j);
    const dx = (hg(i + 1, j) - hg(i - 1, j)) / (2 * step), dz = (hg(i, j + 1) - hg(i, j - 1)) / (2 * step);
    const nl = Math.hypot(dx, 1, dz); const nrm = [-dx / nl, 1 / nl, -dz / nl]; VN.push(nrm);

    let wPath = Math.max(smooth(3.6, 1.2, rd), td < town.r * .8 ? .45 * smooth(town.r * .8, town.r * .4, td) : 0);
    for (const cp of camps) wPath = Math.max(wPath, smooth(12, 6, Math.hypot(x - cp.x, z - cp.z)) * .8);
    if (h < wy + .9) wPath = Math.max(wPath, smooth(wy + .9, wy - .2, h));
    wPath *= .75 + .5 * noise(x * .3, z * .3);
    let wCliff = smooth(.2, .45, slope); if (def.pal !== 'snow' && h > 18) wCliff = Math.max(wCliff, smooth(18, 26, h) * .8);

  for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { V(i, j); V(i + 1, j); V(i, j + 1); V(i + 1, j + 1); V(i, j + 1); V(i + 1, j); }
  // skirt plane outside the zone (painted cliff)

  mb.quad([-far, 22, -far], [far, 22, -far], [far, 22, -SZ], [-far, 22, -SZ], ec, [0, -100, 0]); mb.quad([-far, 22, SZ], [far, 22, SZ], [far, 22, far], [-far, 22, far], ec, [0, -100, 0]);

// ---------- helpers ----------
function npcName(id) { for (const z of Object.values(ZONES)) { const n = z.npcs.find(x => x.id === id); if (n) return n.name; } return id; }
function npcZone(id) { for (const [k, z] of Object.entries(ZONES)) if (z.npcs.some(x => x.id === id)) return z.name; return ''; }
function objLabel(o) { if (o.t === 'kill') return `${MOBS[o.m].name} slain`; if (o.t === 'boss') return `${MOBS[o.m].name} defeated`; if (o.t === 'loot') return o.item; if (o.t === 'gather') return NODES[o.node].name + ' gathered'; if (o.t === 'explore') { for (const z of Object.values(ZONES)) for (const e of z.explore || []) if (e.id === o.id) return `Explore ${e.name}`; } return ''; }
function questMobHint(m) { const p = G.player; for (const id in p.quests.active) { const q = QBY[id], st = p.quests.active[id]; for (let i = 0; i < q.obj.length; i++) { const o = q.obj[i]; if (((o.t === 'kill' || o.t === 'boss') && o.m === m.key) || (o.t === 'loot' && o.m.includes(m.key))) return `<div class="y">${q.name}</div><div class="gr">- ${objLabel(o)}: ${st.c[i]}/${o.n || 1}</div>`; } } return ''; }
function questDetail(q, mode) {
  const p = G.player, st = p.quests.active[q.id];
  let h = `<div class="parch"><h4>${q.name}</h4>`;
  if (mode === 'complete') h += `<p style="margin-top:0">${q.done}</p>`;
  else if (mode === 'progress') h += `<p style="margin-top:0"><i>${npcName(q.turnin)} looks at you expectantly.</i></p>`;
  else h += `<p style="margin-top:0">${q.text}</p>`;
  if (mode !== 'complete') { h += `<b>Objectives</b>`; q.obj.forEach((o, i) => { if (o.t === 'talk') h += `<div class="obj">• Speak with ${npcName(q.turnin)} in ${npcZone(q.turnin)}</div>`; else h += `<div class="obj">• ${objLabel(o)}${st ? `: ${st.c[i]}/${o.n || 1}` : ` (${o.n || 1})`}</div>`; }); }
  if (q.turnin !== q.giver && mode !== 'complete') h += `<div class="obj" style="margin-top:4px;font-size:12px;color:#6a4a20">Return to: ${npcName(q.turnin)}</div>`;
  const rw = q.rw ? questReward(q) : null;
  h += `<div class="rw"><b>Rewards</b><div style="display:flex;align-items:center;gap:10px;margin-top:4px">${rw ? `<div data-rwtip="${q.id}" style="display:flex;align-items:center;gap:6px;cursor:help;background:rgba(0,0,0,.75);padding:3px 8px 3px 3px;border-radius:4px">${itemIcon(rw)}<span style="color:${QCOL[rw.q]};font-size:13px">${rw.n}${rw.cnt > 1 ? ' x' + rw.cnt : ''}</span></div>` : ''}<div style="font-family:Arial;font-size:13px;background:rgba(0,0,0,.75);padding:4px 8px;border-radius:4px">${money(questGold(q))}</div><div style="font-size:13px">${questXP(q)} XP</div></div></div></div>`;
  return h;
}
function statLines(it) { const n = { str: 'Strength', agi: 'Agility', int: 'Intellect', sta: 'Stamina' }; return Object.entries(it.st || {}).filter(([k]) => k !== 'arm').map(([k, v]) => `<div>+${v} ${n[k]}</div>`).join(''); }
function itemTip(it, equipped) {
  if (!it) return '';
  let h = `<div class="tn" style="color:${QCOL[it.q || 0]}">${it.n}</div>`;
  if (it.s === 'quest') return h + '<div class="y">Quest Item</div>';
  if (SLOTS.includes(it.s)) {
    h += `<div class="row"><span>${SLOT_NAME[it.s]}</span><span>${it.s === 'weapon' ? '' : it.st.arm ? ARMOR_TYPE[G.player.cls][0].toUpperCase() + ARMOR_TYPE[G.player.cls].slice(1) : ''}</span></div>`;
    if (it.w) h += `<div class="row"><span>${it.w.min} - ${it.w.max} Damage</span><span>Speed ${it.w.spd.toFixed(2)}</span></div><div>(${((it.w.min + it.w.max) / 2 / it.w.spd).toFixed(1)} damage per second)</div>`;
    if (it.st.arm) h += `<div>${it.st.arm} Armor</div>`;
    h += statLines(it);
    h += `<div class="gr">Item Level ${it.il}</div>`;
    if (!equipped) { const cur = G.player.eq[it.s]; const diff = {}; for (const k of ['str', 'agi', 'int', 'sta', 'arm']) { const d = (it.st[k] || 0) - (cur ? cur.st[k] || 0 : 0); if (d) diff[k] = d; } if (it.w) { const dp = (it.w.min + it.w.max) / 2 / it.w.spd - (cur && cur.w ? (cur.w.min + cur.w.max) / 2 / cur.w.spd : 0); if (Math.abs(dp) > .05) diff.dps = +dp.toFixed(1); } const nm = { str: 'Strength', agi: 'Agility', int: 'Intellect', sta: 'Stamina', arm: 'Armor', dps: 'Damage Per Second' }; const ks = Object.keys(diff); if (ks.length) h += `<div style="margin-top:4px;border-top:1px solid #444;padding-top:3px" class="gr">If you replace ${cur ? 'your equipped item' : 'empty slot'}:</div>` + ks.map(k => `<div class="${diff[k] > 0 ? 'g' : 'r'}">${diff[k] > 0 ? '+' : ''}${diff[k]} ${nm[k]}</div>`).join(''); h += `<div class="g" style="margin-top:3px">Click to equip</div>`; }
  } else if (it.s === 'use') { const u = it.use; h += `<div class="g">Use: ${u.t === 'heal' ? `Restores ${u.v} health.` : u.t === 'mana' ? `Restores ${u.v} mana.` : 'Restores health and mana over 6 sec. Must remain out of combat.'}</div>`; }
  else if (it.s === 'junk') h += `<div class="gr">Junk — sell to a vendor</div>`;
  h += `<div style="margin-top:3px">Sell Price: ${money(sellPrice(Object.assign({}, it, { cnt: 1 })))}</div>`;
  return h;
}
function abilityTip(id) {
  const a = ABIL[id], p = G.player; const res = { mana: 'Mana', rage: 'Rage', energy: 'Energy' }[p.resType];
  return `<div class="tn">${a.name}</div><div class="row"><span>${a.cost ? a.cost + ' ' + res : ''}</span><span>${a.range && a.range > 5 ? a.range + ' yd range' : a.range ? 'Melee range' : ''}</span></div><div class="row"><span>${a.cast ? a.cast + ' sec cast' : 'Instant'}</span><span>${a.cd ? (a.cd >= 60 ? a.cd / 60 + ' min' : a.cd + ' sec') + ' cooldown' : ''}</span></div><div class="y" style="margin-top:3px">${a.desc}</div>${a.lvl > p.lvl ? `<div class="r">Requires level ${a.lvl}</div>` : ''}`;
}
function buyItem(it, i) { const p = G.player; if (p.gold < it.price) { UI.err('You don\'t have enough money.'); return; } const copy = JSON.parse(JSON.stringify(it)); copy.uid = ITEM_UID++; if (!addItem(copy)) { UI.err('Inventory is full.'); return; } p.gold -= it.price; SFX.play('coin'); UI.chat(`You purchase <span style="color:${QCOL[it.q]}">[${it.n}]</span>.`, '#3a3'); if (!it.key) { UI.vendor._stock.splice(i, 1); } UI.renderVendor(); }
function sellItem(i) { const p = G.player, it = p.inv[i]; if (!it) return; const v = sellPrice(it); p.gold += v; p.inv[i] = null; UI.chat(`Sold <span style="color:${QCOL[it.q || 0]}">[${it.n}]</span> for ${moneyTxt(v)}.`, '#ff0'); SFX.play('coin'); UI.dirty.bags = true; UI.dirty.bar = true; }

// ---------- sound (WebAudio synth) ----------
const SFX = {
  ctx: null,
  play(k) {
    if (!G.sound) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, t = c.currentTime;
      const tone = (f, d, type = 'sine', v = .08, f2, delay = 0) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t + delay); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + delay + d); g.gain.setValueAtTime(v, t + delay); g.gain.exponentialRampToValueAtTime(.0001, t + delay + d); o.connect(g); g.connect(c.destination); o.start(t + delay); o.stop(t + delay + d + .02); };
      const noise = (d, v = .06, f = 1200) => { const b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), dd = b.getChannelData(0); for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / dd.length); const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; s.buffer = b; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); };
      switch (k) {
        case 'swing': noise(.12, .07, 900); break; case 'hit': noise(.1, .09, 600); tone(140, .1, 'square', .03, 70); break;
        case 'hurt': tone(220, .12, 'sawtooth', .025, 110); break; case 'cast': tone(500, .25, 'sine', .03, 900); break;
        case 'buff': tone(600, .15, 'triangle', .04, 900); tone(900, .2, 'triangle', .03, 1200, .08); break;
        case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .06, null, i * .12)); break;
        case 'quest': [392, 523, 659].forEach((f, i) => tone(f, .4, 'triangle', .05, null, i * .1)); break;
        case 'qdone': tone(784, .25, 'triangle', .05); tone(1047, .3, 'triangle', .05, null, .1); break;
        case 'loot': tone(880, .08, 'square', .02); break; case 'coin': tone(1320, .08, 'square', .025); tone(1760, .1, 'square', .02, null, .06); break;
        case 'error': tone(180, .15, 'square', .025); break; case 'click': tone(700, .04, 'square', .015); break;
        case 'equip': noise(.15, .06, 2000); break; case 'death': tone(300, 1.2, 'sawtooth', .04, 60); break;
      }
    } catch (e) { }
  },
};

const MENU = {

  for (const pr of G.proj) { R.draw(MESH.orb, TF(pr.x, pr.y, pr.z, .45), { unlit: true, em: pr.col, tint: [0, 0, 0] }); R.draw(MESH.orb, TF(pr.x, pr.y, pr.z, 1.1), { unlit: true, em: pr.col, alpha: .3, order: 2 }); }
  // effects
  for (const f of G.fx) {
    const k = f.t / f.dur;
    if (f.type === 'burst') R.draw(MESH.orb, TF(f.x, f.y, f.z, (.4 + k * 1.6) * f.a), { unlit: true, em: f.col, alpha: (1 - k) * .7, order: 2 });
    if (f.type === 'slash') R.draw(MESH.cube, M4.chain(M4.T(f.x, f.y, f.z), M4.RY(G.player.face + 1), M4.RZ(k * 3 - 1.5), M4.S(.08, 1.8 * f.a, .08)), { unlit: true, em: [1, 1, 1], alpha: (1 - k) * .8, order: 2 });
    if (f.type === 'nova') { const r = f.a * 2 * (.2 + k * .8); R.draw(MESH.ring, TF(f.x, f.y + .15, f.z, r, 1, r), { unlit: true, em: f.col, tint: [0, 0, 0], alpha: 1 - k, order: 2 }); R.draw(MESH.disc, TF(f.x, f.y + .1, f.z, r, 1, r), { unlit: true, em: f.col, tint: [0, 0, 0], alpha: (1 - k) * .3, order: 2 }); }
    if (f.type === 'heal') for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + k * 3; R.draw(MESH.spark, TF(f.x + Math.cos(a) * .8, f.y + k * 2.6 + i * .15, f.z + Math.sin(a) * .8, .2 * f.a), { unlit: true, em: f.col, alpha: 1 - k, order: 2 }); }
    if (f.type === 'shield') { const e = G.player; R.draw(MESH.orb, TF(e.x, e.y + 1.1 * e.scale, e.z, 2.6 * e.scale), { unlit: true, em: f.col, alpha: .2 * (1 - k * .5), order: 2 }); }
    if (f.type === 'beam' && f.tgt) { const x1 = f.tgt.x, y1 = f.tgt.y + 1.2, z1 = f.tgt.z; const dx = x1 - f.x, dy = y1 - f.y, dz = z1 - f.z, L = Math.hypot(dx, dy, dz); const yaw = Math.atan2(dx, dz), pitch = Math.acos(clamp(dy / L, -1, 1)); for (let j = 0; j < 2; j++) R.draw(MESH.beam, M4.chain(M4.T(f.x, f.y, f.z), M4.RY(yaw), M4.RX(pitch), M4.S(.25 + j * .3, L, .25 + j * .3)), { unlit: true, em: f.col, alpha: (1 - k) * (j ? .3 : .9), order: 2 }); }
    if (f.type === 'levelup') { for (let i = 0; i < 3; i++) R.draw(MESH.beam, TF(f.x, f.y, f.z, 2.4 - i * .6, 12 * (1 - k * .3), 2.4 - i * .6), { unlit: true, em: [1, .85, .3], alpha: (1 - k) * .25, order: 2 }); }
  }
  // water
  if (Z.falls) R.draw(Z.falls, M4.I(), { alpha: .82, em: [.12, .14, .16], order: 0, uv: [0, -t * .9], noCast: true });
  if (Z.water) R.draw(Z.water, M4.T(0, Math.sin(t) * .05, 0), { water: !Z.def.water.ice, alpha: Z.def.water.ice ? .9 : .8, em: [.03, .05, .08], order: 0, uv: Z.def.water.ice ? [0, 0] : [t * .02, t * .012] });
  // snow
  if (Z.def.snowfall) { for (let i = 0; i < 160; i++) { const sx = ((i * 37.7) % 60) - 30, sz = ((i * 91.3) % 60) - 30, sy = (40 - ((t * 3 + i * 7.3) % 40)); R.draw(MESH.cube, TF(CAM.at[0] + sx + Math.sin(t + i) * .5, CAM.at[1] - 8 + sy, CAM.at[2] + sz, .12), { unlit: true, em: [1, 1, 1], tint: [0, 0, 0] }); } }
  if (Z.isDungeon && Z.id === 'spire') { for (let i = 0; i < 60; i++) { const sx = ((i * 37.7) % 40) - 20, sz = ((i * 91.3) % 40) - 20, sy = (14 - ((t * 1.5 + i * 3.3) % 14)); R.draw(MESH.cube, TF(CAM.at[0] + sx, sy, CAM.at[2] + sz, .1), { unlit: true, em: [.8, .9, 1], tint: [0, 0, 0] }); } }
  R.flush();
}

// ---------- simulation step ----------
function step(dt) {
  G.t += dt; const p = G.player; processLater(dt); tickWorld(dt); tickAuction(dt); if (G.todMode === 'cycle') G.tod = (G.tod + dt / (24 * 60)) % 1;
  updatePlayer(dt);
  updateAuras(p, dt);
  for (const e of G.ents) {
    if (e.flash > 0) e.flash -= dt;
    if (e === p) continue;
    if (e.kind === 'mob') { updateMob(e, dt); updateAuras(e, dt); }
    else if (e.kind === 'pet') { updatePet(e, dt); updateAuras(e, dt); }
    else if (e.kind === 'ally') { updateAlly(e, dt); updateAuras(e, dt); }
    else if (e.kind === 'node' && e.dead) { e.respawnT -= dt; if (e.respawnT <= 0) e.dead = false; }
    else if (e.kind === 'npc') { if (dist2(e, p) > 8) e.face = lerp(e.face, e.npc.face0 !== undefined ? e.npc.face0 : e.face, .01); }
    if (e.kind === 'mob' || e.kind === 'pet' || e.kind === 'ally') { const gy = G.zone.H(e.x, e.z); const fl = e.model.float ? 0 : 0; e.y = (e.dead ? gy : gy + fl); if (G.zone.inWater(e.x, e.z)) e.y = Math.max(gy, G.zone.waterY - 1.2); if (e.castT > 0) e.castT -= dt; }
  }
  G.ents = G.ents.filter(e => !e.remove);
  if (G.target && (G.target.remove || (G.target.dead && !G.target.loot && G.target.kind === 'mob' && G.target.deadT > 2))) G.target = null;
  // projectiles
  for (const pr of G.proj) {
    const t = pr.tgt, ty = t.y + (t.h || 2) * .55; const dx = t.x - pr.x, dy = ty - pr.y, dz = t.z - pr.z, d = Math.hypot(dx, dy, dz);
    const s = pr.speed * dt; if (d <= s || t.dead) { pr.done = true; if (!t.dead) pr.onHit(); continue; }
    pr.x += dx / d * s; pr.y += dy / d * s; pr.z += dz / d * s;
    if (Math.random() < .9) G.parts.push({ x: pr.x, y: pr.y, z: pr.z, vx: rand(-.4, .4), vy: rand(-.2, .6), vz: rand(-.4, .4), life: .35, max: .35, col: pr.col, size: .13, grav: 0 });
  }
  G.proj = G.proj.filter(p => !p.done);
  for (const f of G.fx) f.t += dt; G.fx = G.fx.filter(f => f.t < f.dur);
  for (const tl of G.tele) { tl.t += dt; if (tl.t >= tl.dur && !tl.done) { tl.done = true; tl.onEnd(tl); } } G.tele = G.tele.filter(t => !t.done);
  checkTriggers(dt);
}

// ---------- loop ----------
let lastT = 0, saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastT) / 1000 || .016); lastT = now; pumpHiQueue(G.mode === 'play' ? 9 : 30);
  try {
    if (G.mode === 'play') { let sdt = dt; if (G.hitStop > 0) { G.hitStop -= dt; sdt = dt * .06; } G._dt = sdt; step(sdt); updateParticles(sdt); updateCamera(dt); R.flash = Math.max(0, R.flash - dt * 3); render(); UI.update(dt); saveT += dt; if (saveT > 20) { saveT = 0; saveGame(); } }
    else { MENU.render(dt); }
  } catch (err) { console.error(err); if (!G._errShown) { G._errShown = true; UI.chat && UI.chat('Error: ' + err.message, '#f44'); } }
}
function boot() { setTimeout(boot2, 30); }
function boot2() {
  const cv = document.getElementById('gl');
  try { R.init(cv); } catch (e) { document.getElementById('fatal').style.display = 'flex'; document.getElementById('fatal').textContent = 'Your browser does not support WebGL: ' + e.message; return; }
  initMeshes(); bindInput(cv); UI.init(); MENU.init(); const ld = document.getElementById('loading'); if (ld) ld.remove();
  addEventListener('resize', () => R.resize());
  addEventListener('beforeunload', saveGame);
  requestAnimationFrame(frame);
}
function enterWorld(save) {
  G.mode = 'play'; G.jumpRequested=false; G.pet = null; G._errShown = false; G.parts = []; G.later = [];
  G.player = makePlayer(save); initWorld(save);
  ITEM_UID = 1 + Math.max(0, ...[...save.inv, ...Object.values(save.eq), ...(G.market.listings||[]).map(l=>l.item), ...(G.market.returns||[])].filter(Boolean).map(i => i.uid || 0));
  document.getElementById('menu').style.display = 'none'; document.getElementById('hud').style.display = 'block';
  UI.resetChat(); UI.chat(`Welcome to ${GAME_TITLE}! Press H for controls.`, '#ffd200');
  if (save.lvl === 1 && !save.quests.done.length && !Object.keys(save.quests.active).length) UI.chat('Talk to the townsfolk with a yellow ! above their heads to find work.', '#ffd200');
  loadZone(save.zone, save.x, save.z, save.face);
  UI.dirty.all = true; seedAuction(); UI.chat('1: nearest enemy + auto attack · J: choose two sidekicks · U: Auction house · Space: jump', '#ffd200'); if(!G.bots.some(b=>b.party)) UI.open('companions');
}
function logout() { saveGame(); G.mode = 'menu'; UI.closeAll(); document.getElementById('hud').style.display = 'none'; document.getElementById('menu').style.display = 'block'; MENU.show('select'); }

// World of DaneCraft: player-directed party and persistent local market.
ABIL.u_auto={name:'Auto Attack',g:'⚔',col:'#b74320',lvl:1,cost:0,cd:0,gcd:false,tgt:'self',desc:'Press 1 to target the nearest enemy within 35 yards and begin auto attacks. Press again to stop. Move into weapon range. After a kill, nearby enemies within 12 yards are selected.'};
function toggleAutoAttack(){const p=G.player;if(!p||p.dead)return false;if(p.autoAtk){p.autoAtk=false;UI.chat('Auto attack stopped.','#aaa');return true;}const t=nearestBy(enemiesNear(p,p.x,p.z,35),p);if(!t){UI.err('No enemy nearby.');return false;}G.target=t;p.face=Math.atan2(t.x-p.x,t.z-p.z);p.autoAtk=true;p.swing=0;UI.dirty.frames=true;return true;}
const safeText=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const [id,title,key] of [['companions','Sidekicks','J'],['auction','Auction House','U']]){const w=document.createElement('div');w.className='win';w.id='w-'+id;w.style.cssText='left:50%;top:95px;transform:translateX(-50%);width:min(760px,94vw);z-index:40;max-height:calc(100vh - 205px)';$('hud').appendChild(w);const b=document.createElement('button');b.className='btn';b.textContent=title+' ['+key+']';b.onclick=()=>UI.toggle(id);let dock=$('daneDock');if(!dock){dock=document.createElement('div');dock.id='daneDock';dock.className='pe';dock.style.cssText='position:absolute;right:18px;bottom:112px;display:flex;gap:7px';$('hud').appendChild(dock);}dock.appendChild(b);}
const ds=document.createElement('style');ds.textContent='.drow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid #584526}.drow>div{flex:1}.drow small{display:block;color:#bcb49d;margin-top:4px}.drow select,.drow input,#w-auction input{background:#16120d;color:#ffeac0;border:1px solid #96763b;border-radius:4px;padding:7px;max-width:100%}.drow input{width:100px}.dnote{color:#c3b79d;font-size:13px;line-height:1.5}.dtab{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.dtag{color:#9ee6bc}.drow .btn{font-size:12px;padding:6px 10px}.slot.casting{box-shadow:0 0 12px #ffd200;border-color:#ffd200}';document.head.appendChild(ds);
UI.w_companions=function(){const rows=[...G.bots].sort((a,b)=>Number(b.party)-Number(a.party)||a.lvl-b.lvl);return this.title('Choose your sidekicks · '+(partyCount()-1)+'/2','companions')+`<div class="wb"><p class="dnote">Choose adventurers below, or create a sidekick with your preferred race and class. Both follow you, fight, heal according to class, gain levels, and travel between zones. Swap only outside combat.</p><div class="drow"><div><label>Race <select id="dcRace">${Object.entries(RACES).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join('')}</select></label></div><div><label>Class <select id="dcClass">${Object.entries(CLASSES).map(([k,c])=>`<option value="${k}">${c.name} · ${allyRole(k)}</option>`).join('')}</select></label></div><button class="btn" onclick="createSidekick()">Create & recruit</button></div>${rows.map(r=>`<div class="drow"><div><b style="color:${CLASS_COL(r.cls)}">${safeText(r.name)}</b>${r.party?' <span class="dtag">• Your sidekick</span>':''}<small>Level ${r.lvl} · ${RACES[r.race].name} ${CLASSES[r.cls].name} · ${allyRole(r.cls)}</small></div><button class="btn" onclick="chooseSidekick('${r.id}')">${r.party?'Dismiss':'Recruit'}</button></div>`).join('')}</div>`;};
function partyBusy(){return G.player.dead || friendlies().some(inCombat);}
function chooseSidekick(id){if(partyBusy()){UI.err('Choose sidekicks while alive and out of combat.');return;}const r=G.bots.find(b=>b.id===id);if(!r)return;if(r.party)kickBot(r);else inviteBot(r);G.allies=G.ents.filter(e=>e.kind==='ally');UI.render('companions');saveGame();}
function createSidekick(){if(partyBusy()){UI.err('Choose sidekicks while alive and out of combat.');return;}if(partyCount()>=3){UI.err('Dismiss a sidekick first. You can bring two.');return;}const r=newBotRec(G.player.lvl,G.zone.isDungeon?DUNGEONS[G.zone.id].from:G.zone.id,{race:$('dcRace').value,cls:$('dcClass').value});r.xp=0;G.bots.push(r);chooseSidekick(r.id);}
const baseInvite=inviteBot;inviteBot=function(rec){if(partyBusy()){UI.err('Recruit outside combat.');return;}const result=baseInvite(rec);G.allies=G.ents.filter(e=>e.kind==='ally');return result;};
const baseKick=kickBot;kickBot=function(rec){if(partyBusy()){UI.err('Dismiss outside combat.');return;}return baseKick(rec);};
function marketHistory(msg){G.market.history.unshift(msg);G.market.history.length=Math.min(20,G.market.history.length);}
function botListing(r){const m=G.market;if(m.listings.filter(l=>l.seller===r.id).length>=3)return;const it=Math.random()<.3?defItem('hp1',randi(1,3)):genItem(Math.min(21,r.lvl),Math.random()<.2?3:2,'any',r.cls);m.listings.push({id:m.next++,item:it,seller:r.id,name:r.name,price:Math.max(1,Math.round(sellPrice(it)*rand(1.4,2.8))),left:1800});}
function seedAuction(){const m=G.market;for(const r of G.bots)if(!Number.isFinite(r.gold))r.gold=300+r.lvl*150;if(!m.seeded){G.bots.slice(0,10).forEach(botListing);m.seeded=true;saveGame();}}
function tickAuction(dt){const m=G.market;if(!m)return;m.clock+=dt;for(const l of [...m.listings]){l.left-=dt;if(l.left<=0){if(l.seller==='player'){m.returns.push(l.item);marketHistory(l.item.n+' expired — claim it below.');}m.listings=m.listings.filter(x=>x!==l);}}if(m.clock<15)return;m.clock=0;for(const r of G.bots)r.gold=(r.gold||0)+r.lvl*6;
 const buyers=[...G.bots].sort(()=>Math.random()-.5).slice(0,4);
 for(const buyer of buyers){const offers=m.listings.filter(l=>l.seller!==buyer.id&&l.price<=buyer.gold&&l.price<=sellPrice(l.item)*3.5&&(!l.item.il||l.item.il<=buyer.lvl+3));if(!offers.length||Math.random()>.65)continue;const l=pick(offers);buyer.gold-=l.price;buyer.marketGoods=buyer.marketGoods||[];buyer.marketGoods.push(l.item);if(buyer.marketGoods.length>10)buyer.marketGoods.shift();if(l.seller==='player'){G.player.gold+=l.price;const msg=buyer.name+' bought '+l.item.n+' for '+moneyTxt(l.price)+'.';marketHistory(msg);UI.chat(msg,'#ffd200');UI.dirty.bags=true;}else{const seller=G.bots.find(b=>b.id===l.seller);if(seller)seller.gold+=l.price;}m.listings=m.listings.filter(x=>x!==l);}
 if(m.listings.length<35)botListing(pick(G.bots));saveGame();if(UI.openWins.has('auction')&&UI.auctionTab!=='sell'&&!UI.typing())UI.render('auction');}
UI.auctionTab='browse';
UI.w_auction=function(){const m=G.market,p=G.player,tab=this.auctionTab;let body='';if(tab==='sell'){body=`<p class="dnote">Set a buyout price in copper for the entire stack. 100 copper = 1 silver; 10,000 copper = 1 gold. Listings last 30 minutes of active play. No fee. AI buyers compare price and level; sales are not guaranteed.</p>`+p.inv.map((it,i)=>it&&it.s!=='quest'?`<div class="drow">${itemIcon(it)}<div><b style="color:${QCOL[it.q||0]}">${safeText(it.n)}${it.cnt>1?' ×'+it.cnt:''}</b><small>Vendor value ${moneyTxt(sellPrice(it))} · ${safeText(Object.entries(it.st||{}).map(([k,v])=>k+' +'+v).join(' · '))}</small></div><label>Buyout (c)<br><input type="number" min="1" max="100000000" step="1" id="price-${i}" value="${Math.max(1,sellPrice(it)*2)}" aria-label="Buyout for ${safeText(it.n)}"></label><button class="btn" onclick="postAuction(${i})">List</button></div>`:'').join('');}else{const rows=m.listings.filter(l=>tab==='mine'?l.seller==='player':l.seller!=='player');body=rows.map(l=>`<div class="drow">${itemIcon(l.item)}<div><b style="color:${QCOL[l.item.q||0]}">${safeText(l.item.n)}${l.item.cnt>1?' ×'+l.item.cnt:''}</b><small>${safeText(l.name)} · ${l.item.il?'Item level '+l.item.il+' · ':''}${Math.ceil(l.left/60)} min left</small><small>${safeText(Object.entries(l.item.st||{}).map(([k,v])=>k+' +'+v).join(' · '))}${l.item.w?' · Damage '+l.item.w.min+'–'+l.item.w.max:''}</small></div><span>${money(l.price)}</span><button class="btn" onclick="${tab==='mine'?'cancelAuction':'buyAuction'}(${l.id})">${tab==='mine'?'Cancel':'Buyout'}</button></div>`).join('')||'<p class="dnote">No listings yet.</p>';}
return this.title('DaneCraft Auction House','auction')+`<div class="wb"><div>Wallet: ${money(p.gold)}</div><div class="dnote">Local simulated economy · AI players trade while the game is running · transactions save automatically.</div><div class="dtab">${[['browse','Browse'],['sell','Sell goods'],['mine','My listings']].map(([k,t])=>`<button class="btn" ${tab===k?'disabled':''} onclick="UI.auctionTab='${k}';UI.render('auction')">${t}</button>`).join('')}</div>${body}${m.returns.length?`<h3>Unclaimed goods</h3>${m.returns.map((it,i)=>`<div class="drow"><div>${safeText(it.n)}</div><button class="btn" onclick="claimAuction(${i})">Claim item</button></div>`).join('')}`:''}<h3>Recent activity</h3><div class="dnote">${m.history.map(safeText).join('<br>')||'Your sales and returns will appear here.'}</div></div>`;};
function marketRefresh(){UI.dirty.bags=true;UI.dirty.bar=true;UI.render('auction');saveGame();}
function postAuction(i){const it=G.player.inv[i],input=$('price-'+i),price=Number(input&&input.value);if(!it||it.s==='quest')return;if(!Number.isSafeInteger(price)||price<1||price>100000000){UI.err('Enter a whole copper price from 1 to 100,000,000.');return;}if(G.market.listings.filter(l=>l.seller==='player').length>=20){UI.err('Maximum 20 active listings.');return;}G.market.listings.push({id:G.market.next++,item:it,seller:'player',name:G.player.name,price,left:1800});G.player.inv[i]=null;marketHistory('Listed '+it.n+' for '+moneyTxt(price)+'.');marketRefresh();}
function buyAuction(id){const l=G.market.listings.find(l=>l.id===id);if(!l||l.seller==='player')return;if(G.player.gold<l.price){UI.err('Not enough money.');return;}if(!addItem(l.item)){UI.err('Inventory is full.');return;}G.player.gold-=l.price;const seller=G.bots.find(b=>b.id===l.seller);if(seller)seller.gold=(seller.gold||0)+l.price;G.market.listings=G.market.listings.filter(x=>x!==l);marketHistory('Bought '+l.item.n+' for '+moneyTxt(l.price)+'.');marketRefresh();}
function cancelAuction(id){const l=G.market.listings.find(l=>l.id===id&&l.seller==='player');if(!l)return;G.market.returns.push(l.item);G.market.listings=G.market.listings.filter(x=>x!==l);marketHistory('Cancelled '+l.item.n+' — claim it below.');marketRefresh();}
function claimAuction(i){const it=G.market.returns[i];if(!it)return;if(!addItem(it)){UI.err('Inventory is full.');return;}G.market.returns.splice(i,1);marketRefresh();}
addEventListener('pagehide',()=>saveGame());

boot();
