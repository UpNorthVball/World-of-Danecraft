<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World of DaneCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd200;--bronze:#8a6a2a;--bronze2:#c8a050;--panel:rgba(10,8,6,.86);--txt:#f0e6cc;--parch:#eadbb4;--ink:#3a2410;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--txt);font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;padding:40px;text-align:center}
.hidden{display:none!important}
button{font-family:inherit}
.btn{background:linear-gradient(#8a1a0a,#5a0a04);color:var(--gold);border:2px solid #c8a050;border-radius:4px;padding:6px 16px;font-size:14px;font-weight:bold;cursor:pointer;text-shadow:0 1px 2px #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 4px rgba(0,0,0,.6);letter-spacing:.3px}
.btn:hover{background:linear-gradient(#aa2a14,#7a1408);color:#fff}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.big{font-size:18px;padding:10px 34px}
/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;pointer-events:none}
#menu>*{pointer-events:auto}
#logo{position:absolute;top:6px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(370px,29vw)}
#logo img{width:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);filter:drop-shadow(0 0 24px rgba(70,150,255,.35))}
#menu{--mfont:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Georgia,serif;font-family:var(--mfont)}
.gtxt{background:linear-gradient(180deg,#fff6c8 0%,#ffd76a 38%,#d9a032 62%,#8a5a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 1px #000) drop-shadow(0 0 8px rgba(255,190,60,.25))}
.mpanel{position:absolute;background:linear-gradient(180deg,rgba(14,24,52,.93),rgba(6,10,26,.95));border:2px solid #d9a840;border-radius:8px;box-shadow:0 0 0 1px #3a2608,0 0 0 4px rgba(10,16,34,.95),0 0 0 5px #8a6420,0 0 26px rgba(60,140,255,.32),0 10px 30px rgba(0,0,0,.85),inset 0 0 24px rgba(40,90,200,.22),inset 0 1px 0 rgba(255,230,160,.25);padding:14px}
.mpanel::before,.mpanel::after{content:'';position:absolute;top:-9px;width:14px;height:14px;background:radial-gradient(circle at 35% 30%,#bfe6ff,#3a8cff 45%,#0a2a7a 80%);border:2px solid #e2b54a;transform:rotate(45deg);box-shadow:0 0 10px rgba(80,170,255,.8)}
.mpanel::before{left:-9px}.mpanel::after{right:-9px}
.mpanel h3{margin:0 0 10px;font-size:17px;text-align:center;letter-spacing:2px;font-weight:900;text-transform:uppercase;background:linear-gradient(180deg,#fff6c8,#ffd76a 40%,#c98e26 70%,#7a4e10);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 1px #000);padding-bottom:8px;border-bottom:1px solid rgba(217,168,64,.45);position:relative}
#menu .btn{font-family:var(--mfont);font-weight:700;letter-spacing:1px;background:linear-gradient(180deg,#24407a 0%,#122452 48%,#0a1636 52%,#0e1d44 100%);color:#ffd76a;border:2px solid #d9a840;border-radius:5px;text-shadow:0 1px 0 #000,0 0 8px rgba(255,200,80,.35);box-shadow:inset 0 1px 0 rgba(170,210,255,.35),inset 0 0 10px rgba(40,110,255,.25),0 0 0 1px #2a1a04,0 3px 8px rgba(0,0,0,.7)}
#menu .btn:hover{background:linear-gradient(180deg,#3460b0 0%,#1c3878 48%,#11225a 52%,#1a3070 100%);color:#fff3c4;box-shadow:inset 0 1px 0 rgba(190,225,255,.5),0 0 14px rgba(80,170,255,.7),0 0 0 1px #2a1a04}
#menu .btn.big{font-size:20px;padding:11px 40px;letter-spacing:2px}
#selPanel{right:24px;top:120px;bottom:110px;width:310px;display:flex;flex-direction:column}
#charList{flex:1;overflow:auto}
.charRow{padding:10px 12px;margin-bottom:8px;border:1px solid rgba(120,150,210,.3);border-radius:5px;cursor:pointer;background:linear-gradient(180deg,rgba(30,50,100,.45),rgba(10,18,40,.55))}
.charRow:hover{border-color:#b89040;box-shadow:0 0 10px rgba(70,150,255,.35)}
.charRow.sel{border-color:#ffd76a;background:linear-gradient(180deg,rgba(50,90,180,.55),rgba(16,30,70,.6));box-shadow:inset 0 0 14px rgba(110,180,255,.35),0 0 12px rgba(255,200,80,.25)}
.charRow b{color:#ffd76a;font-size:18px;letter-spacing:1px;text-shadow:0 2px 2px #000}
.charRow small{display:block;color:#b8c8e8;margin-top:3px;font-family:'Palatino Linotype',Georgia,serif;font-size:13px}
#selButtons{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#enterBtn{position:absolute;bottom:34px;left:50%;transform:translateX(-50%)}
#racePanel{left:20px;top:120px;width:260px;max-height:calc(100% - 140px);overflow:auto}
#classPanel{right:20px;top:120px;width:260px;max-height:calc(100% - 140px);overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:6px 8px;margin:5px 0;border:1px solid rgba(120,150,210,.28);border-radius:5px;cursor:pointer;background:linear-gradient(180deg,rgba(28,46,96,.4),rgba(8,14,34,.5))}
.opt:hover{border-color:#b89040;box-shadow:0 0 8px rgba(70,150,255,.35)}
.opt.sel{border-color:#ffd76a;background:linear-gradient(180deg,rgba(50,90,180,.55),rgba(16,30,70,.6));box-shadow:inset 0 0 12px rgba(110,180,255,.35)}
.opt .ic{width:34px;height:34px;font-size:18px;box-shadow:0 0 0 1px #d9a840,inset 0 0 8px rgba(0,0,0,.6)}
.opt .nm{font-weight:700;font-size:15px;color:#ffe4a0;letter-spacing:.5px}
.opt .tag{font-size:10px;background:#c81;color:#fff;border-radius:3px;padding:1px 4px;margin-left:4px;font-family:Arial,sans-serif;vertical-align:middle}
.opt small{display:block;font-size:11px;color:#a8b8d8;font-family:'Palatino Linotype',Georgia,serif}
#descBox{left:50%;transform:translateX(-50%);bottom:100px;width:min(640px,calc(100% - 580px));min-width:300px;font-size:13px;line-height:1.45;font-family:'Palatino Linotype',Georgia,serif;color:#dfe6f6}
#descBox b{color:#ffd76a;font-family:var(--mfont)}
#descBox .trait{color:#8fe0ff}
#createBar{left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:10px;padding:10px 16px}
#createBar input{background:#060c20;border:1px solid #d9a840;color:#ffd76a;font-family:var(--mfont);font-size:17px;padding:7px 10px;width:190px;border-radius:4px;outline:none;box-shadow:inset 0 0 8px rgba(40,110,255,.3)}
#createBar input:focus{box-shadow:inset 0 0 8px rgba(40,110,255,.3),0 0 10px rgba(80,170,255,.6)}
.cust{display:flex;align-items:center;gap:4px;font-size:12px;color:#cfd8ee;letter-spacing:1px}
#menu .cust button{width:24px;height:24px;padding:0;font-size:13px}
#loading{flex-direction:column;gap:18px;background:radial-gradient(ellipse at 50% 40%,#0c1a3e 0%,#040816 60%,#000 100%)!important}
#loading img{width:min(860px,88vw);-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%);animation:lgIn 1.2s ease-out both}
#loading .lbar{width:min(420px,60vw);height:8px;border:1px solid #d9a840;border-radius:5px;background:#050a1a;overflow:hidden;box-shadow:0 0 12px rgba(70,150,255,.45)}
#loading .lbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#7cc4ff,#ffd76a,transparent);animation:lgBar 1.4s linear infinite}
@keyframes lgIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes lgBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#menuHint{font-family:'Palatino Linotype',Georgia,serif}
#menuHint{position:absolute;bottom:6px;left:10px;font-size:11px;color:#998;pointer-events:none}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .pe{pointer-events:auto}
.ic{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 8px rgba(0,0,0,.6);overflow:hidden;flex:none}
.unit{position:absolute;display:flex;align-items:center;filter:drop-shadow(0 2px 3px #000)}
.portrait{width:64px;height:64px;border-radius:50%;border:3px solid #c8a050;background:radial-gradient(circle at 40% 35%,#5a4a3a,#1a120a);display:flex;align-items:center;justify-content:center;font-size:30px;z-index:2;box-shadow:0 0 0 2px #000,inset 0 0 10px #000;position:relative}
.portrait .lv{position:absolute;bottom:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:#1a1208;border:2px solid #c8a050;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold}
.ubody{margin-left:-14px;width:190px;background:rgba(0,0,0,.75);border:2px solid #8a6a2a;border-left:none;border-radius:0 6px 6px 0;padding:3px 6px 4px 18px}
.uname{font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:17px}
.bar{position:relative;height:13px;background:#111;border:1px solid #000;margin-top:2px;border-radius:2px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;transition:width .15s}
.bar>span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;font-family:Arial,sans-serif}
.hp>i{background:linear-gradient(#3fdc3f,#159015)}
.mana>i{background:linear-gradient(#4a7aff,#1a3ab0)}
.rage>i{background:linear-gradient(#ff3a3a,#a01010)}
.energy>i{background:linear-gradient(#ffe84a,#b8a010)}
#pframe{left:12px;top:12px}
#tframe{left:290px;top:12px}
#tframe .portrait{order:2;margin-left:-14px}
#tframe .ubody{order:1;margin-left:0;border-left:2px solid #8a6a2a;border-right:none;border-radius:6px 0 0 6px;padding:3px 18px 4px 6px}
#tframe.elite .portrait{border-color:#ffd200;box-shadow:0 0 0 2px #000,0 0 12px #ffaa00}
#tframe.elite .portrait::after{content:'';position:absolute;inset:-9px;border:3px solid #ffd200;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);opacity:.85}
#tframe .tclass{font-size:10px;color:#ccb;margin-top:1px}
#combo{display:flex;gap:3px;margin-top:3px;height:8px}
#combo i{width:10px;height:8px;border-radius:50%;background:#330;border:1px solid #000}
#combo i.on{background:radial-gradient(#ffb,#f80)}
#petframe{left:30px;top:94px;transform:scale(.72);transform-origin:left top}
#partyframes{position:absolute;left:14px;top:100px;display:flex;flex-direction:column;gap:5px;pointer-events:auto;z-index:5}
.pmem{display:flex;align-items:center;cursor:pointer;width:200px}
.pmem .pcls{width:30px;height:30px;border-radius:50%;background:radial-gradient(#3a3020,#120d08);border:2px solid #8a6a2a;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffd890;z-index:1;box-shadow:0 0 0 1px #000}
.pmem .pbody{margin-left:-8px;flex:1;background:rgba(0,0,0,.72);border:1px solid #8a6a2a;border-left:none;border-radius:0 5px 5px 0;padding:2px 6px 3px 12px}
.pmem .pnm{font-size:11px;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden}
.pmem .plv{color:#ffd200;font-size:10px}
.pmem .bar{height:10px}.pmem .bar>span{font-size:9px;line-height:9px}
.pmem.dead{opacity:.55}.pmem.sel .pbody{border-color:#ffd200;box-shadow:0 0 6px #ffd200}
.plate .php{width:56px;height:4px;background:#200;border:1px solid #000;margin:2px auto 0}.plate .php i{display:block;height:100%;background:#3c3}
#tInvite{display:none;margin-top:4px;padding:2px 8px;font-size:11px;background:linear-gradient(#5a4020,#2a1a08);border:1px solid #c8a050;color:#ffd890;border-radius:4px;cursor:pointer;pointer-events:auto}
#invitePop{display:none;position:absolute;left:50%;top:22%;transform:translateX(-50%);width:340px;padding:12px 14px;background:rgba(10,8,6,.92);border:2px solid #c8a050;border-radius:8px;color:#eee;text-align:center;font-size:14px;z-index:30;pointer-events:auto;box-shadow:0 6px 30px #000}
.ahtabs{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ahtab{background:linear-gradient(#3a2a14,#1a1208);border:1px solid #8a6a2a;color:#d8c090;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px}
.ahtab.on{background:linear-gradient(#8a5a1a,#4a2a08);color:#fff;border-color:#ffd200}
.ahbar{display:flex;gap:8px;margin-bottom:6px}.ahbar input{flex:1}.ahbar input,.ahbar select,.ahprice input,#cpName{background:#120d08;border:1px solid #8a6a2a;color:#eee;padding:4px 6px;border-radius:3px;font-family:inherit}
.ahprice{margin-top:8px;font-size:14px}.ahprice input{width:56px}
.ahlist{max-height:360px;overflow:auto;border:1px solid #3a2a14;background:rgba(0,0,0,.35)}
.ahrow{display:grid;grid-template-columns:34px 1fr 40px 90px 70px 120px 64px;align-items:center;gap:6px;padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.ahrow:hover{background:rgba(255,210,0,.08)}.ahrow.ahh{font-size:11px;color:#aa9;background:rgba(0,0,0,.4)}
.ahm{font-family:Arial;font-size:12px;text-align:right}.btn.sm{padding:3px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:default}
.ahsell{display:flex;gap:10px;align-items:center;padding:8px;background:rgba(0,0,0,.3);border:1px solid #5a4020;border-radius:4px}
.cpcard{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:6px;background:rgba(0,0,0,.35);border:1px solid #5a4020;border-radius:5px}
.cpic{width:44px;height:44px;border-radius:50%;background:radial-gradient(#3a3020,#120d08);border:2px solid #8a6a2a;display:flex;align-items:center;justify-content:center;font-size:22px}
.cplbl{font-size:12px;font-weight:bold;margin:8px 0 3px;color:#5a3a10}.cpgrid{display:flex;flex-wrap:wrap;gap:4px}
.cpopt{background:#f8ecd0;border:1px solid #a88a5a;border-radius:3px;padding:3px 8px;cursor:pointer;font-family:inherit;font-size:12px;color:#3a2a10}.cpopt.on{background:#3a2a10;color:#ffd890!important;border-color:#3a2a10}
#invitePop .ibtns{display:flex;gap:10px;justify-content:center;margin-top:10px}
#tauras,#pauras{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
#buffs{position:absolute;right:215px;top:12px;display:flex;gap:4px;flex-direction:row-reverse;flex-wrap:wrap;max-width:300px}
.buff{width:30px;text-align:center;font-size:10px;color:#ff8;font-family:Arial,sans-serif;text-shadow:0 1px 1px #000}
.buff .ic{width:30px;height:30px;font-size:15px;border:1px solid #000}
.buff.debuff .ic{box-shadow:0 0 0 2px #c00}
.aura{width:18px;height:18px;font-size:10px;border:1px solid #000}
.aura.mine{box-shadow:0 0 0 1px #ff0}
#mm{position:absolute;right:14px;top:10px;width:184px;text-align:center}
#mmZone{font-size:13px;color:var(--gold);text-shadow:0 1px 2px #000,0 0 4px #000;margin-bottom:3px;font-weight:bold;white-space:nowrap}
#mmWrap{position:relative;width:170px;height:170px;margin:0 auto;border-radius:50%;border:4px solid #8a6a2a;box-shadow:0 0 0 2px #000,0 4px 10px #000,inset 0 0 14px #000;overflow:hidden;background:#000}
#mmCv{width:100%;height:100%;display:block}
#mmN{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffd;font-weight:bold;text-shadow:0 0 3px #000}
#mmClock{font-size:11px;color:#ccc;margin-top:2px;text-shadow:0 1px 2px #000}
#mmBtns{position:absolute;right:0;top:20px;display:flex;flex-direction:column;gap:3px}
.mmb{width:24px;height:24px;border-radius:50%;background:#2a1e10;border:2px solid #8a6a2a;color:var(--gold);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#tracker{position:absolute;right:16px;top:230px;width:250px;text-shadow:0 1px 2px #000,0 0 3px #000;font-size:12px}
#tracker .tq{margin-bottom:6px}
#tracker .tq b{color:var(--gold);font-size:13px;cursor:pointer}
#tracker .tq div{color:#ddd;padding-left:8px}
#tracker .tq div.done{color:#6f6}
#tracker .tq.complete b::after{content:' (Complete)';color:#6f6;font-weight:normal}
#bottom{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#bar{display:flex;gap:3px;padding:5px 6px;background:linear-gradient(#2a2016,#120c06);border:2px solid #8a6a2a;border-radius:6px 6px 0 0;box-shadow:0 0 0 1px #000,0 -2px 10px rgba(0,0,0,.7);position:relative}
.slot{width:44px;height:44px;border:1px solid #000;background:rgba(0,0,0,.6);border-radius:4px;position:relative;cursor:pointer;box-shadow:inset 0 0 6px #000}
.slot .ic{width:42px;height:42px;font-size:22px}
.slot .kb{position:absolute;top:1px;right:3px;font-size:11px;color:#ddd;font-family:Arial,sans-serif;font-weight:bold;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.slot .ct{position:absolute;bottom:1px;right:3px;font-size:12px;color:#fff;font-family:Arial,sans-serif;font-weight:bold;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.slot .cd{position:absolute;inset:0;border-radius:4px;z-index:2;pointer-events:none}
.slot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;color:#ffd;font-family:Arial,sans-serif;text-shadow:0 0 3px #000,0 0 3px #000;z-index:3;pointer-events:none}
.slot.nores .ic{filter:saturate(.3) brightness(.6) sepia(1) hue-rotate(190deg)}
.slot.oor .ic{filter:brightness(.7) sepia(1) hue-rotate(-50deg) saturate(3)}
.slot.locked .ic{filter:grayscale(1) brightness(.4)}
.slot.press{transform:scale(.92)}
.slot.casting{box-shadow:0 0 0 2px #ffd200}
.slot.drop{box-shadow:0 0 0 2px #0f0}
#xpbar{width:100%;height:12px;background:#120a1a;border:1px solid #000;border-top:none;position:relative}
#xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b05aff,#5a1aaa)}
#xpbar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:11px;font-family:Arial,sans-serif;color:#fff;text-shadow:0 0 2px #000}
#micro{position:absolute;right:8px;bottom:8px;display:flex;gap:3px;padding:4px;background:linear-gradient(#2a2016,#120c06);border:2px solid #8a6a2a;border-radius:6px}
.mbtn{width:30px;height:38px;border-radius:4px;border:1px solid #000;background:linear-gradient(#5a3a1a,#2a1a0a);color:var(--gold);font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.mbtn small{font-size:9px;color:#ccb;margin-top:2px;font-family:Arial,sans-serif}
.mbtn:hover{filter:brightness(1.3)}
#castbar{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:260px;height:20px;background:#111;border:2px solid #c8a050;border-radius:3px;display:none;box-shadow:0 0 0 1px #000,0 2px 6px #000}
#castbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffd84a,#c88a10)}
#castbar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:17px;color:#fff;text-shadow:0 0 3px #000}
#chat{position:absolute;left:10px;bottom:12px;width:430px;font-size:13px}
#chatLog{max-height:190px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 1px #000,0 0 3px #000;padding:4px 6px;border-radius:4px;transition:background .3s}
#chat:hover #chatLog{background:rgba(0,0,0,.35)}
#chatLog div{margin:1px 0;line-height:1.25}
#chatIn{width:100%;display:none;background:rgba(0,0,0,.75);border:1px solid #8a6a2a;color:#fff;font-family:inherit;font-size:13px;padding:5px;outline:none}

kbd{background:#2a2016;border:1px solid #8a6a2a;border-radius:3px;padding:0 5px;font-family:Arial,sans-serif;font-size:12px;color:var(--gold)}

    if (o.hat) { mb.mat('cloth', 2.5).cyl(TF(0, .36, 0, .78, .05, .78), 14, 1, 1, o.hat); mb.cone(TF(0, .38, -.04, .42, .6, .42, 0, -.25), 10, o.hat); mb.mat('metal', 3).cyl(TF(0, .38, 0, .44, .06, .44), 12, 1, 1, GOLD); }

    if (o.mane) mb.sphere(TF(0, H * .28, L * .22, W * 1.08, H * .5, L * .5), 10, 7, o.mane);

  mb.mat(null); for (const sx of [-1, 1]) for (let k = 0; k < 3; k++) mb.sphere(TF(sx * (.06 + k * .05) * s, .08 * s, .58 * s, .07 * s, .07 * s, .07 * s), 5, 3, o.eyes || '#e33', 0);

// ---------- animation ----------
function animModel(model, st, t) {
  const out = [];
  const sw = Math.sin(st.walk) * st.mv, at = st.atk > 0 ? Math.sin(st.atk * PI) : 0;
  const bob = model.float ? Math.sin(t * 2 + (st.seed || 0)) * .15 * model.float : Math.abs(Math.sin(st.walk)) * .05 * st.mv;
  const breathe = Math.sin(t * 1.6 + (st.seed || 0)) * .012;
  for (const p of model.parts) {
    let m = M4.T(p.p[0], p.p[1] + bob, p.p[2]);
    switch (p.a) {
      case 'legL': m = M4.mul(m, M4.RX(sw * .7)); break;
      case 'legR': m = M4.mul(m, M4.RX(-sw * .7)); break;
      case 'torso': m = M4.chain(m, M4.RX(Math.abs(sw) * .05 + (st.atk > 0 ? at * .18 : 0)), M4.RY(st.atk > 0 ? -at * .25 : 0), M4.S(1 + breathe, 1, 1 + breathe)); break;
      case 'head': m = M4.mul(M4.T(0, breathe * 3, 0), M4.mul(m, M4.RY(Math.sin(t * .5 + (st.seed || 0)) * .1))); break;
      case 'armL': m = st.cast ? M4.mul(m, M4.RX(-1.2 + Math.sin(t * 8) * .1)) : M4.mul(m, M4.mul(M4.RX(-sw * .55), M4.RZ(-.1 - breathe * 2))); break;
      case 'armR': m = st.cast ? M4.mul(m, M4.RX(-1.3 + Math.sin(t * 8 + 1) * .1)) : st.atk > 0 ? M4.mul(m, M4.mul(M4.RX(-.6 - at * 1.7), M4.RZ(at * .45))) : M4.mul(m, M4.mul(M4.RX(sw * .55 - .12), M4.RZ(.1 + breathe * 2))); break;
      case 'body': m = M4.mul(m, M4.RX(st.atk > 0 ? -at * .15 : 0)); if (model.kind === 'bird') m = M4.mul(M4.T(0, Math.sin(t * 3) * .1, 0), m); break;
      case 'qhead': m = M4.mul(m, M4.RX(st.atk > 0 ? at * .5 : Math.sin(t * 1.3 + (st.seed || 0)) * .06)); break;
      case 'qleg': { const ph = (p.i === 0 || p.i === 3) ? 1 : -1; m = M4.mul(m, M4.RX(sw * .6 * ph)); break; }
      case 'sleg': { const ph = p.i % 2 ? 1 : -1; m = M4.chain(m, M4.RY(p.ry + sw * .3 * ph), M4.RZ(Math.abs(Math.sin(st.walk + p.i)) * .15 * st.mv)); break; }
      case 'wing': m = M4.mul(m, M4.RZ(p.i * (Math.sin(t * 6) * .5 + (st.atk > 0 ? at * .4 : 0)))); break;
      case 'core': m = M4.mul(m, M4.RY(t * .7)); break;
      case 'orbit': { const a = t * 1.2 + p.i / 6 * TAU; m = M4.T(Math.cos(a) * p.rad, p.p[1] + Math.sin(a * 2) * .3 + bob, Math.sin(a) * p.rad); m = M4.mul(m, M4.RY(a)); break; }
    }
    out.push(m);
  }
  return out;
}

// ---------- race / class appearance ----------
function playerModel(race, cls, skinIdx = 0, hairIdx = 0) {
  return cached(`pl|${race}|${cls}|${skinIdx}|${hairIdx}`, () => {
    const r = RACES[race], c = CLASSES[cls];
    const o = Object.assign({}, r.look, c.look);
    o.skin = r.skins[skinIdx % r.skins.length];
    o.hair = HAIR_COLORS[hairIdx % HAIR_COLORS.length];
    o.mat = c.mat || 'cloth'; if (o.tailCol === 'skin') o.tailCol = o.skin; if (r.look.glowEyes && c.look.glowEyes) o.glowEyes = c.look.glowEyes;
    const m = buildHumanoid(o); m.scale = r.scale; return m;
  });
}

// ---------- scenery (added to a static MB) ----------
function gnarl(mb, p, dir, len, rad, depth, col, tips, dead) {
  let l = Math.hypot(...dir); dir = dir.map(v => v / l);
  // build oriented segment with a slight bend
  const segs = 2; let cur = p, d = dir;
  for (let k = 0; k < segs; k++) {
    const sl = len / segs; const end = [cur[0] + d[0] * sl, cur[1] + d[1] * sl, cur[2] + d[2] * sl];
    const r0 = rad * (1 - k * .18), r1 = rad * (1 - (k + 1) * .18);
    const yaw = Math.atan2(d[0], d[2]), pitch = Math.acos(clamp(d[1], -1, 1));
    mb.cyl(M4.chain(M4.T(cur[0], cur[1], cur[2]), M4.RY(yaw), M4.RX(pitch), M4.S(1, sl * 1.04, 1)), depth > 1 ? 7 : 5, r0 * 2, r1 * 2, col);
    cur = end; d = [d[0] + rand(-.25, .25), d[1] + rand(-.05, .12), d[2] + rand(-.25, .25)]; l = Math.hypot(...d); d = d.map(v => v / l);
  }
  if (depth <= 0) { tips.push([cur[0], cur[1], cur[2], 0]); return; }
  const kids = depth >= 3 ? 3 : dead ? 3 : 2;
  for (let i = 0; i < kids; i++) {
    const a = i / kids * TAU + rand(-.5, .5), spread = dead ? rand(.55, 1.05) : rand(.5, .9);
    const nd = [d[0] + Math.cos(a) * spread, d[1] * (dead ? .7 : .8), d[2] + Math.sin(a) * spread];
    gnarl(mb, cur, nd, len * rand(.6, .78), rad * .6, depth - 1, col, tips, dead);
  }
  if (depth <= 2) tips.push([cur[0], cur[1], cur[2], depth]);
}

// Canopies are built from leaf-card "blobs" whose normals point away from the blob centre,
// so whole crowns shade as soft rounded volumes (the hand-painted MMO look) instead of flat cards.
function v3n(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

const QUESTS = [
  // Sunmeadow Vale
  { id: 'q_boars', name: 'Boars in the Barley', giver: 'tobin', lvl: 1, text: 'Those bramble boars are tearing up my barley something fierce! I\'m too old to chase them myself. Thin their numbers in the fields east of town, would ya? My harvest depends on it.', obj: [{ t: 'kill', m: 'boar', n: 6 }], done: 'The fields are quiet again. Here, take this — you\'ve earned it.', rw: { slot: 'chest' } },
  { id: 'q_pelts', name: 'Wolf Pelts for Winter', giver: 'tobin', req: ['q_boars'], lvl: 2, text: 'Winter\'s coming, and my grandchildren need warm cloaks. The meadow wolves roaming north and east of town have fine thick pelts. Bring me five.', obj: [{ t: 'loot', item: 'Meadow Wolf Pelt', n: 5, m: ['wolf'], ch: .6 }], done: 'Lovely pelts! The little ones will be toasty this winter.', rw: { slot: 'feet' } },
  { id: 'q_report', name: 'Word for the Marshal', giver: 'tobin', turnin: 'brenna', req: ['q_boars'], lvl: 2, text: 'I saw red-cloaked folk skulking near the old camp to the northeast. Bandits, I\'d wager. Marshal Holt needs to hear about this — she\'s in the town square.', obj: [{ t: 'talk' }], done: 'Redcloaks? So they\'ve returned. Thank you for bringing this to me, friend.' },
  { id: 'q_redcloak', name: 'The Redcloak Menace', giver: 'brenna', req: ['q_report'], lvl: 4, text: 'The Redcloak Bandits have made camp northeast of Hearthstead. They\'ve been raiding merchant carts on the road. Drive them out — show them Hearthstead is not defenseless.', obj: [{ t: 'kill', m: 'bandit', n: 6 }, { t: 'kill', m: 'bandit_mage', n: 2 }], done: 'Well fought! The roads will be safer thanks to you.', rw: { slot: 'weapon' } },
  { id: 'q_voss', name: 'The Bandit Lord', giver: 'brenna', req: ['q_redcloak'], lvl: 6, text: 'Their leader, Voss, still holds the heart of the camp. He\'s a dangerous brute — an elite fighter. Bring me his signet ring and the Redcloaks will scatter for good. Be ready; you may want to reach level 6 first.', obj: [{ t: 'loot', item: 'Signet of Voss', n: 1, m: ['voss'], ch: 1 }], done: 'Voss\'s signet! The Redcloaks are finished. Hearthstead owes you a great debt.', rw: { slot: 'any', q: 3 } },
  { id: 'q_gnawers', name: 'Trouble Underfoot', giver: 'alda', lvl: 3, text: 'Burrow Gnawers — ratlike creatures from below — have been digging up the west fields and spreading sickness. Please, cull them before the plague spreads.', obj: [{ t: 'kill', m: 'gnawer', n: 8 }], done: 'The Light thanks you. The sickness should ebb now.', rw: { slot: 'hands' } },
  { id: 'q_herbs', name: 'Sunpetal Remedy', giver: 'alda', lvl: 2, text: 'I need Sunpetal blossoms for my healing salves. They grow wild in the meadows around town — look for bright yellow flowers glowing in the grass.', obj: [{ t: 'gather', node: 'sunpetal', n: 6 }], done: 'Wonderful! These will save many lives.', rw: { item: 'hp1', n: 5 } },
  { id: 'q_deep', name: 'Into the Gnawing Deep', giver: 'alda', req: ['q_gnawers'], lvl: 6, text: 'The gnawers pour out of a great tunnel to the southeast — the Gnawing Deep. Their chieftain, Gnashjaw, drives them on. End him, and the swarm will break. (Dungeon, level 5-7)', obj: [{ t: 'boss', m: 'gnashjaw' }], done: 'You faced the chieftain in his own den! The burrows will fall silent at last.', rw: { slot: 'any', q: 3 } },
  { id: 'q_gristle', name: 'The Old Boar', giver: 'tobin', req: ['q_pelts'], lvl: 6, text: 'There\'s an old boar named Gristlehide out by the southwest hills. Big as a cart, mean as a storm. He\'s gored three of my best hands. Put him down for good.', obj: [{ t: 'kill', m: 'gristle', n: 1 }], done: 'Gristlehide, slain at last! You\'re a true hero of the Vale.', rw: { slot: 'any', q: 2 } },
  { id: 'q_onward', name: 'The Road to Whisperpine', giver: 'brenna', turnin: 'elric', req: ['q_redcloak'], lvl: 6, text: 'The Warden of Pinehollow has sent word of darkness stirring in Whisperpine Forest to the north. Follow the road north through the pass and find Warden Elric Thorne.', obj: [{ t: 'talk' }], done: 'Brenna sent you? Good. We need every blade we can get.' },
  // Whisperpine
  { id: 'w_webs', name: 'Webs in the Pines', giver: 'elric', lvl: 6, text: 'Gloomfang spiders have overrun Webwood Hollow to the west. Their webs choke the old trails. Burn through them, and slay the spiders.', obj: [{ t: 'kill', m: 'spider', n: 8 }], done: 'The western trails are passable again. Fine work.', rw: { slot: 'legs' } },
  { id: 'w_venom', name: 'Venom Sacs', giver: 'yenna', lvl: 6, text: 'Gloomfang venom, carefully distilled, makes a powerful antidote. Bring me six venom sacs — careful, they burst easily!', obj: [{ t: 'loot', item: 'Gloomfang Venom Sac', n: 6, m: ['spider', 'spiderling'], ch: .55 }], done: 'Perfect, and only slightly leaking. Thank you!', rw: { item: 'hp2', n: 3 } },
  { id: 'w_shade', name: 'Nightshade Harvest', giver: 'yenna', lvl: 7, text: 'Nightshade blooms in the shadow of the old pines. It glows faintly violet. Gather eight for me.', obj: [{ t: 'gather', node: 'nightshade', n: 8 }], done: 'Such potent blooms! The forest is generous to those who listen.', rw: { slot: 'trinket' } },
  { id: 'w_bears', name: 'Thicket Bears', giver: 'rowan', lvl: 7, text: 'The bears in the eastern thicket have gone mad — something in the forest is driving them to attack anything that moves. Put them out of their misery.', obj: [{ t: 'kill', m: 'bear', n: 7 }], done: 'A grim task, but a necessary one. You have my thanks.', rw: { slot: 'head' } },
  { id: 'w_coven', name: 'The Witchwood Coven', giver: 'elric', req: ['w_webs'], lvl: 8, text: 'Cultists of the Witchwood gather in a grove to the southeast. They worship something rotten in the heart of the forest. Break their circle.', obj: [{ t: 'kill', m: 'cultist', n: 5 }, { t: 'kill', m: 'cult_guard', n: 5 }], done: 'The coven is scattered. But their master remains...', rw: { slot: 'weapon' } },
  { id: 'w_tomes', name: 'Ritual Tomes', giver: 'elric', req: ['w_webs'], lvl: 8, text: 'The cultists carry tomes of dark ritual. Recover five so our lorekeepers can learn what they serve.', obj: [{ t: 'loot', item: 'Witchwood Ritual Tome', n: 5, m: ['cultist', 'cult_guard'], ch: .5 }], done: 'These pages speak of "the Rotheart" — a corrupted heart beneath Hollowroot. Ill tidings.', rw: { slot: 'chest' } },
  { id: 'w_bark', name: 'Hollow Bark', giver: 'yenna', lvl: 8, text: 'The Hollow Treants in the western glade were once guardians of this forest. Something has hollowed them out. Bring me samples of their bark so I can study the corruption.', obj: [{ t: 'loot', item: 'Corrupted Bark', n: 6, m: ['treant'], ch: .6 }], done: 'Rot... from the inside out. It\'s coming from Hollowroot, I\'m sure of it.', rw: { slot: 'feet' } },
  { id: 'w_stones', name: 'The Weeping Stones', giver: 'rowan', lvl: 8, text: 'There\'s an ancient stone circle in the far southwest — the Weeping Stones. Hunters say they\'ve been bleeding sap. Go look, and tell me what you find.', obj: [{ t: 'explore', id: 'stones' }], done: 'Bleeding sap... the forest itself is wounded. Thank you for scouting.', rw: { slot: 'hands' } },
  { id: 'w_mother', name: 'Mother of the Brood', giver: 'rowan', req: ['w_bears'], lvl: 9, text: 'A monstrous spider — Mother Skitterfang — lairs in the far west. Every spider in Webwood is her spawn. Kill her, and the brood dies with her.', obj: [{ t: 'kill', m: 'skitterfang', n: 1 }], done: 'Skitterfang slain! Webwood will heal, in time.', rw: { slot: 'any', q: 2 } },
  { id: 'w_heart', name: 'Heart of Hollowroot', giver: 'elric', req: ['w_coven'], lvl: 11, text: 'The Rotheart festers in Hollowroot Sanctum, north of here. It is the source of the forest\'s corruption. Enter the sanctum and cut out that rotten heart. (Dungeon, level 9-12)', obj: [{ t: 'boss', m: 'rotheart' }], done: 'The Rotheart is destroyed. Already I can feel the forest breathing easier.', rw: { slot: 'any', q: 3 } },
  { id: 'w_east', name: 'Embers to the East', giver: 'elric', turnin: 'drask', req: ['w_coven'], lvl: 10, text: 'Commander Drask of Ember Outpost has requested aid in the Cinderscar Badlands, east of here. Take the eastern pass and report to him.', obj: [{ t: 'talk' }], done: 'Fresh blood from the forest! Good. The badlands will test you.' },
  // Cinderscar
  { id: 'c_scorp', name: 'Stinger Flats', giver: 'kett', lvl: 10, text: 'Cinder scorpions swarm the flats south of the outpost. They\'re ambushing our supply runners. Clear them out.', obj: [{ t: 'kill', m: 'scorpion', n: 8 }], done: 'Supply lines are open again. Nice work.', rw: { slot: 'legs' } },
  { id: 'c_buzz', name: 'Carrion Feathers', giver: 'kett', lvl: 11, text: 'Ashwing buzzard feathers make the best fletching in the realm. Bring me six — the buzzards circle the ridges in the south.', obj: [{ t: 'loot', item: 'Ashwing Feather', n: 6, m: ['buzzard'], ch: .6 }], done: 'Beautiful feathers. My arrows will fly true.', rw: { slot: 'head' } },
  { id: 'c_bloom', name: 'Firebloom Essence', giver: 'ysra', lvl: 11, text: 'Firebloom grows only where the earth is hottest. I need eight for my research into the ember-veins below the badlands.', obj: [{ t: 'gather', node: 'firebloom', n: 8 }], done: 'Marvelous! These will burn bright in my crucibles.', rw: { item: 'mp2', n: 4 } },
  { id: 'c_rene', name: 'The Renegade Hold', giver: 'drask', lvl: 12, text: 'Ember renegades have broken from their clans and seized the old hold to the east. They serve Forgemaster Valgrim now. Break their ranks.', obj: [{ t: 'kill', m: 'renegade', n: 6 }, { t: 'kill', m: 'pyromancer', n: 4 }], done: 'Their hold is broken. But Valgrim still forges weapons below.', rw: { slot: 'weapon' } },
  { id: 'c_crater', name: 'The Searing Crater', giver: 'ysra', lvl: 12, text: 'Magma elementals have risen from the crater to the north. Travel there and observe — then quell the elementals before they spread.', obj: [{ t: 'explore', id: 'crater' }, { t: 'kill', m: 'magma', n: 6 }], done: 'Elementals... they\'re being called up by someone. Someone in the forge.', rw: { slot: 'chest' } },
  { id: 'c_skarn', name: 'Pyrelord Skarn', giver: 'ysra', req: ['c_crater'], lvl: 14, text: 'The greatest of the elementals, Pyrelord Skarn, burns in the far northeast. Douse him for good.', obj: [{ t: 'kill', m: 'skarn', n: 1 }], done: 'Skarn is no more! Fire bows to you, it seems.', rw: { slot: 'any', q: 2 } },
  { id: 'c_forge', name: 'The Cinderforge', giver: 'drask', req: ['c_rene'], lvl: 15, text: 'Forgemaster Valgrim arms the renegades from the Cinderforge Depths to the southeast. Descend into the forge and end him. (Dungeon, level 13-16)', obj: [{ t: 'boss', m: 'valgrim' }], done: 'Valgrim\'s hammer falls silent. The badlands are in your debt.', rw: { slot: 'any', q: 3 } },
  { id: 'c_north', name: 'Into the Frost', giver: 'drask', turnin: 'hilde', req: ['c_rene'], lvl: 14, text: 'A rider from Coldharbor brought grim news — the Rime Queen has awakened in Frostveil Peaks to the north. Jarl Hilde Frostmane needs champions. Go.', obj: [{ t: 'talk' }], done: 'Drask speaks highly of you. Welcome to Coldharbor, champion.' },
  // Frostveil
  { id: 'f_wolves', name: 'The Howling Drifts', giver: 'skadi', lvl: 14, text: 'Rimewolves hunt in great packs west of Coldharbor. They\'ve taken our livestock and two of our scouts. Thin the packs.', obj: [{ t: 'kill', m: 'rimewolf', n: 8 }], done: 'The drifts are quieter. Thank you, friend.', rw: { slot: 'feet' } },
  { id: 'f_yeti', name: 'Shagmaw Hides', giver: 'skadi', lvl: 15, text: 'Shagmaw yeti hides keep a warrior warm through the coldest night. Bring me six from the caves to the east.', obj: [{ t: 'loot', item: 'Shagmaw Hide', n: 6, m: ['yeti'], ch: .6 }], done: 'Fine hides! Coldharbor\'s guards will thank you this winter.', rw: { slot: 'chest' } },
  { id: 'f_lotus', name: 'Frost Lotus', giver: 'oren', lvl: 15, text: 'Frost Lotus blooms beneath the snow, glowing a pale blue. Its petals can ward against the Rime Queen\'s chill. Gather eight.', obj: [{ t: 'gather', node: 'frostlotus', n: 8 }], done: 'With these, our wards will hold a little longer.', rw: { item: 'hp3', n: 3 } },
  { id: 'f_wraith', name: 'Shades of the Lake', giver: 'oren', lvl: 16, text: 'Ice wraiths haunt the frozen lake to the northwest — the restless dead, bound by the Queen. Release them.', obj: [{ t: 'kill', m: 'wraith', n: 8 }], done: 'May they rest at last. The Queen\'s grip weakens.', rw: { slot: 'head' } },
  { id: 'f_shrine', name: 'Shrine of the First Snow', giver: 'oren', lvl: 16, text: 'Legend says the first snow fell at a shrine in the northeast. If the Queen draws power from it, we must know. Find the shrine.', obj: [{ t: 'explore', id: 'shrine' }], done: 'The shrine is cold and dark... she has drained it. We must strike soon.', rw: { slot: 'trinket' } },
  { id: 'f_giants', name: 'Giant\'s Rest', giver: 'hilde', lvl: 18, text: 'Rime Giants have come down from the high peaks to serve the Queen. Each is a fortress unto itself. Topple four of them.', obj: [{ t: 'kill', m: 'giant', n: 4 }], done: 'Four giants felled! The skalds will sing of this.', rw: { slot: 'weapon' } },
  { id: 'f_glacius', name: 'The Undying', giver: 'skadi', req: ['f_wraith'], lvl: 19, text: 'Glacius the Undying stalks the far northwest — a wraith so old even death forgot him. End him.', obj: [{ t: 'kill', m: 'glacius', n: 1 }], done: 'Even the undying fall before you.', rw: { slot: 'any', q: 3 } },
  { id: 'f_queen', name: 'The Rime Queen', giver: 'hilde', req: ['f_giants'], lvl: 20, text: 'The time has come. Queen Isolde the Rime waits atop her spire to the north. Climb it, defeat her, and free Frostveil from eternal winter. This is the greatest battle of your journey. (Dungeon, level 18-21)', obj: [{ t: 'boss', m: 'isolde' }], done: 'The Queen is fallen! Spring will return to Frostveil. You are a true Champion of DaneCraft!', rw: { slot: 'any', q: 4 } },
  // Jadevine Jungle
  { id: 'w_jungle', name: 'Beyond the Western Pass', giver: 'elric', turnin: 'tamsin', req: ['w_coven'], lvl: 11, text: 'An expedition from the coast has pushed into the jungle beyond our western pass. Captain Tamsin Reed writes that the ruins there are stirring. Take the western road and lend her your sword.', obj: [{ t: 'talk' }], done: 'Reinforcements at last! Welcome to Fernwatch Landing.' },
  { id: 'j_stalk', name: 'Eyes in the Undergrowth', giver: 'tamsin', lvl: 11, text: 'Shadowmane stalkers have been dragging off our porters at dusk. They hunt the thickets north-east of camp. Make them fear us.', obj: [{ t: 'kill', m: 'jstalker', n: 8 }], done: 'The porters can sleep tonight. Well done.', rw: { slot: 'legs' } },
  { id: 'j_bloom', name: 'Jadebloom Samples', giver: 'ilsa', lvl: 11, text: 'Jadebloom only grows where old temple stone meets the soil — it glows faintly green. Gather eight so I can learn what the ruins are leaking into this jungle.', obj: [{ t: 'gather', node: 'jadebloom', n: 8 }], done: 'Fascinating. The roots drink something... ancient.', rw: { item: 'mp2', n: 4 } },

      mb.vert(a.r, [0, 1, 0], ca.map(v => v * .2), 0, 0, -1); mb.vert(a.p, [0, 1, 0], ca, 0, 0, -1); mb.vert(b.p, [0, 1, 0], cb, 0, 0, -1);
      mb.vert(a.r, [0, 1, 0], ca.map(v => v * .2), 0, 0, -1); mb.vert(b.p, [0, 1, 0], cb, 0, 0, -1); mb.vert(b.r, [0, 1, 0], cb.map(v => v * .2), 0, 0, -1); } }

// ---------- helpers ----------
function npcName(id) { for (const z of Object.values(ZONES)) { const n = z.npcs.find(x => x.id === id); if (n) return n.name; } return id; }
function npcZone(id) { for (const [k, z] of Object.entries(ZONES)) if (z.npcs.some(x => x.id === id)) return z.name; return ''; }
function objLabel(o) { if (o.t === 'kill') return `${MOBS[o.m].name} slain`; if (o.t === 'boss') return `${MOBS[o.m].name} defeated`; if (o.t === 'loot') return o.item; if (o.t === 'gather') return NODES[o.node].name + ' gathered'; if (o.t === 'explore') { for (const z of Object.values(ZONES)) for (const e of z.explore || []) if (e.id === o.id) return `Explore ${e.name}`; } return ''; }
function questMobHint(m) { const p = G.player; for (const id in p.quests.active) { const q = QBY[id], st = p.quests.active[id]; for (let i = 0; i < q.obj.length; i++) { const o = q.obj[i]; if (((o.t === 'kill' || o.t === 'boss') && o.m === m.key) || (o.t === 'loot' && o.m.includes(m.key))) return `<div class="y">${q.name}</div><div class="gr">- ${objLabel(o)}: ${st.c[i]}/${o.n || 1}</div>`; } } return ''; }
function questDetail(q, mode) {
  const p = G.player, st = p.quests.active[q.id];
  let h = `<div class="parch"><h4>${q.name}</h4>`;
  if (mode === 'complete') h += `<p style="margin-top:0">${q.done}</p>`;
  else if (mode === 'progress') h += `<p style="margin-top:0"><i>${npcName(q.turnin)} looks at you expectantly.</i></p>`;
  else h += `<p style="margin-top:0">${q.text}</p>`;
  if (mode !== 'complete') { h += `<b>Objectives</b>`; q.obj.forEach((o, i) => { if (o.t === 'talk') h += `<div class="obj">• Speak with ${npcName(q.turnin)} in ${npcZone(q.turnin)}</div>`; else h += `<div class="obj">• ${objLabel(o)}${st ? `: ${st.c[i]}/${o.n || 1}` : ` (${o.n || 1})`}</div>`; }); }
  if (q.turnin !== q.giver && mode !== 'complete') h += `<div class="obj" style="margin-top:4px;font-size:12px;color:#6a4a20">Return to: ${npcName(q.turnin)}</div>`;
  const rw = q.rw ? questReward(q) : null;
  h += `<div class="rw"><b>Rewards</b><div style="display:flex;align-items:center;gap:10px;margin-top:4px">${rw ? `<div data-rwtip="${q.id}" style="display:flex;align-items:center;gap:6px;cursor:help;background:rgba(0,0,0,.75);padding:3px 8px 3px 3px;border-radius:4px">${itemIcon(rw)}<span style="color:${QCOL[rw.q]};font-size:13px">${rw.n}${rw.cnt > 1 ? ' x' + rw.cnt : ''}</span></div>` : ''}<div style="font-family:Arial;font-size:13px;background:rgba(0,0,0,.75);padding:4px 8px;border-radius:4px">${money(questGold(q))}</div><div style="font-size:13px">${questXP(q)} XP</div></div></div></div>`;
  return h;
}
function statLines(it) { const n = { str: 'Strength', agi: 'Agility', int: 'Intellect', sta: 'Stamina' }; return Object.entries(it.st || {}).filter(([k]) => k !== 'arm').map(([k, v]) => `<div>+${v} ${n[k]}</div>`).join(''); }
function itemTip(it, equipped) {
  if (!it) return '';
  let h = `<div class="tn" style="color:${QCOL[it.q || 0]}">${it.n}</div>`;
  if (it.s === 'quest') return h + '<div class="y">Quest Item</div>';
  if (SLOTS.includes(it.s)) {
    h += `<div class="row"><span>${SLOT_NAME[it.s]}</span><span>${it.s === 'weapon' ? '' : it.st.arm ? ARMOR_TYPE[G.player.cls][0].toUpperCase() + ARMOR_TYPE[G.player.cls].slice(1) : ''}</span></div>`;
    if (it.w) h += `<div class="row"><span>${it.w.min} - ${it.w.max} Damage</span><span>Speed ${it.w.spd.toFixed(2)}</span></div><div>(${((it.w.min + it.w.max) / 2 / it.w.spd).toFixed(1)} damage per second)</div>`;
    if (it.st.arm) h += `<div>${it.st.arm} Armor</div>`;
    h += statLines(it);
    h += `<div class="gr">Item Level ${it.il}</div>`;
    if (!equipped) { const cur = G.player.eq[it.s]; const diff = {}; for (const k of ['str', 'agi', 'int', 'sta', 'arm']) { const d = (it.st[k] || 0) - (cur ? cur.st[k] || 0 : 0); if (d) diff[k] = d; } if (it.w) { const dp = (it.w.min + it.w.max) / 2 / it.w.spd - (cur && cur.w ? (cur.w.min + cur.w.max) / 2 / cur.w.spd : 0); if (Math.abs(dp) > .05) diff.dps = +dp.toFixed(1); } const nm = { str: 'Strength', agi: 'Agility', int: 'Intellect', sta: 'Stamina', arm: 'Armor', dps: 'Damage Per Second' }; const ks = Object.keys(diff); if (ks.length) h += `<div style="margin-top:4px;border-top:1px solid #444;padding-top:3px" class="gr">If you replace ${cur ? 'your equipped item' : 'empty slot'}:</div>` + ks.map(k => `<div class="${diff[k] > 0 ? 'g' : 'r'}">${diff[k] > 0 ? '+' : ''}${diff[k]} ${nm[k]}</div>`).join(''); h += `<div class="g" style="margin-top:3px">Click to equip</div>`; }
  } else if (it.s === 'use') { const u = it.use; h += `<div class="g">Use: ${u.t === 'heal' ? `Restores ${u.v} health.` : u.t === 'mana' ? `Restores ${u.v} mana.` : 'Restores health and mana over 6 sec. Must remain out of combat.'}</div>`; }
  else if (it.s === 'junk') h += `<div class="gr">Junk — sell to a vendor</div>`;
  h += `<div style="margin-top:3px">Sell Price: ${money(sellPrice(Object.assign({}, it, { cnt: 1 })))}</div>`;
  return h;
}
function abilityTip(id) {
  const a = ABIL[id], p = G.player; const res = { mana: 'Mana', rage: 'Rage', energy: 'Energy' }[p.resType];
  return `<div class="tn">${a.name}</div><div class="row"><span>${a.cost ? a.cost + ' ' + res : ''}</span><span>${a.range && a.range > 5 ? a.range + ' yd range' : a.range ? 'Melee range' : ''}</span></div><div class="row"><span>${a.cast ? a.cast + ' sec cast' : 'Instant'}</span><span>${a.cd ? (a.cd >= 60 ? a.cd / 60 + ' min' : a.cd + ' sec') + ' cooldown' : ''}</span></div><div class="y" style="margin-top:3px">${a.desc}</div>${a.lvl > p.lvl ? `<div class="r">Requires level ${a.lvl}</div>` : ''}`;
}
function buyItem(it, i) { const p = G.player; if (p.gold < it.price) { UI.err('You don\'t have enough money.'); return; } const copy = JSON.parse(JSON.stringify(it)); copy.uid = ITEM_UID++; if (!addItem(copy)) { UI.err('Inventory is full.'); return; } p.gold -= it.price; SFX.play('coin'); UI.chat(`You purchase <span style="color:${QCOL[it.q]}">[${it.n}]</span>.`, '#3a3'); if (!it.key) { UI.vendor._stock.splice(i, 1); } UI.renderVendor(); }
function sellItem(i) { const p = G.player, it = p.inv[i]; if (!it) return; const v = sellPrice(it); p.gold += v; p.inv[i] = null; UI.chat(`Sold <span style="color:${QCOL[it.q || 0]}">[${it.n}]</span> for ${moneyTxt(v)}.`, '#ff0'); SFX.play('coin'); UI.dirty.bags = true; UI.dirty.bar = true; }

// ---------- sound (WebAudio synth) ----------
const SFX = {
  ctx: null,
  play(k) {
    if (!G.sound) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, t = c.currentTime;
      const tone = (f, d, type = 'sine', v = .08, f2, delay = 0) => { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t + delay); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + delay + d); g.gain.setValueAtTime(v, t + delay); g.gain.exponentialRampToValueAtTime(.0001, t + delay + d); o.connect(g); g.connect(c.destination); o.start(t + delay); o.stop(t + delay + d + .02); };
      const noise = (d, v = .06, f = 1200) => { const b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), dd = b.getChannelData(0); for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / dd.length); const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; s.buffer = b; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); };
      switch (k) {
        case 'swing': noise(.12, .07, 900); break; case 'hit': noise(.1, .09, 600); tone(140, .1, 'square', .03, 70); break;
        case 'hurt': tone(220, .12, 'sawtooth', .025, 110); break; case 'cast': tone(500, .25, 'sine', .03, 900); break;
        case 'buff': tone(600, .15, 'triangle', .04, 900); tone(900, .2, 'triangle', .03, 1200, .08); break;
        case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .06, null, i * .12)); break;
        case 'quest': [392, 523, 659].forEach((f, i) => tone(f, .4, 'triangle', .05, null, i * .1)); break;
        case 'qdone': tone(784, .25, 'triangle', .05); tone(1047, .3, 'triangle', .05, null, .1); break;
        case 'loot': tone(880, .08, 'square', .02); break; case 'coin': tone(1320, .08, 'square', .025); tone(1760, .1, 'square', .02, null, .06); break;
        case 'error': tone(180, .15, 'square', .025); break; case 'click': tone(700, .04, 'square', .015); break;
        case 'equip': noise(.15, .06, 2000); break; case 'death': tone(300, 1.2, 'sawtooth', .04, 60); break;
      }
    } catch (e) { }
  },
};

(function placeAuctioneers() {

})();
const TRADE_GOODS = [['Linen Cloth', 1, 4], ['Copper Ore', 1, 6], ['Light Leather', 2, 5], ['Peacebloom', 1, 4], ['Rough Stone', 1, 3], ['Wool Cloth', 7, 12], ['Tin Ore', 7, 14], ['Medium Leather', 8, 13], ['Briarthorn', 8, 12], ['Silk Cloth', 12, 25], ['Iron Ore', 12, 30], ['Heavy Leather', 13, 26], ['Fadeleaf', 13, 24], ['Mageweave Cloth', 17, 40], ['Mithril Ore', 17, 55], ['Frost Lotus Petal', 17, 50]];

function ahItemFor(L) {
  const r = Math.random();
  if (r < .32) { const opts = TRADE_GOODS.filter(g => g[1] <= L + 3 && g[1] >= L - 9); const g = pick(opts.length ? opts : TRADE_GOODS); return tradeItem(g[0], g[1], g[2], pick([5, 10, 10, 20])); }

      UI.chat(`Your auction of <span style="color:${QCOL[l.it.q || 0]}">[${l.it.n}]</span>${l.it.cnt > 1 ? ' x' + l.it.cnt : ''} sold to ${allyLink(buyer)}! You receive ${moneyTxt(gain)} (5% auction cut).`, '#ffd200');
